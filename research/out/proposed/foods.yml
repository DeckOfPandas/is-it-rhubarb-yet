    research:
      season: "Thornback and blonde ray best to eat June-February (cgsg-thornback-ray, cgsg-blonde-ray, updated January 2026). The ray fishery runs all year with the biggest landings late in the year; the Bristol Channel Ray Box is closed to trawlers 1 December-31 May (cgsg-blonde-ray). Flying Fish Seafoods lists skate wings among its Cornish fresh fish in a calendar graded month by month for availability (poor, varying or good); the grades are colours that could not be read from the page, so the weeks outside the best-to-eat window are taken as landed (avail) (flyingfish-seasonality). Species landed in Cornwall include thornback, blonde, cuckoo, small-eyed, spotted and undulate ray. Landed all year, most late in the year (cgsg-blonde-ray); best June-February (cgsg-thornback-ray). Avail here means out of its best season, not hard to get."
      discrepancy: "Cuckoo and small-eyed ray are ticked from July, not June (cgsg-cuckoo-ray, cgsg-small-eyed-ray); spotted ray is ticked all year (cgsg-spotted-ray). Thornback lay eggs March-September (ices-fishmap-thornback) and blonde ray February-August (cgsg-blonde-ray), overlapping the June-August ticks. Flying Fish Seafoods marks no best-quality months for skate wings, which on its key means consistent quality all year (flyingfish-seasonality), against the regional guide's window; the primary source is used."
      year_round: "On sale all year; at its best June–February. The rest of the year it's still easy to find, just not at its peak."
      sustainability: "CGSG: thornback north coast (VIIf-g) recommended, south coast (VIIe) to avoid; cuckoo ray (all methods) and small-eyed ray (demersal trawl) recommended; blonde and spotted not on its recommended list; do not buy wings under 22 cm (cgsg-recommended, read 2026-11-10)."
