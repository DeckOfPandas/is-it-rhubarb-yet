- name: Parsnips
  slug: parsnips
  group: roots
  also: [veg, vegetables]
  colour: "#ad7e4a"
  text_on_custard: "#926430"
  sources:
  - ahdb-harvested-in-britain
  - fpj-roots-differing-seasons
  - fpj-parsnip-underdog
  - fpj-british-veg-roots
  - morningadvertiser-pauleys-2007
  - defra-wholesale-notice-2016-01
  - defra-wholesale-notice-2016-07
  - freshview-crop-report-2025-07
  notes: ["Defra's wholesale prices list UK parsnips in every month most years."]
  varieties:
  - name: ""
    weeks:
    - [1, 17, in]
    - [18, 26, avail]
    - [27, 52, in]
    sources:
    - ahdb-harvested-in-britain
    - fpj-roots-differing-seasons
    - fpj-parsnip-underdog
    - fpj-british-veg-roots
    - morningadvertiser-pauleys-2007
    - defra-wholesale-notice-2016-01
    - defra-wholesale-notice-2016-07
    - freshview-crop-report-2025-07
    confidence: medium
    research:
      season: "Field crop lifted fresh for most of the year; roots left in the ground under straw and lifted as needed are fresh, not store (rule 3; ahdb-harvested-in-britain). New British roots season, parsnips included, began in July (Huntapac, fpj-british-veg-roots); Produce World expected the new UK crop on shelves in June (fpj-parsnip-underdog). The old crop runs to April-May, when supply gets tight (Produce World, fpj-roots-differing-seasons). Alan Bartlett & Sons sells parsnips through the year but plans a three-to-four-week import window to bridge old and new crops (fpj-parsnip-underdog); its timing within May-June is not stated, so May-June is avail. Defra monthly notices quote home-grown parsnips in every month from Aug 2015 to Jun 2016, at their dearest in June (defra-wholesale-notice-2016-01; defra-wholesale-notice-2016-07). AHDB singles out winter, when frost sweetens the roots (ahdb-harvested-in-britain), and a foodservice supplier called November the start of the parsnip season (morningadvertiser-pauleys-2007), but neither gives months, so no winter peak is split out. On sale nearly all year. In = July to April, the season growers name; May-June is avail because the old crop is tailing off and the new crop just starting, not because parsnips are hard to find. Previous Dec-Feb window (a reading of AHDB's 'winter') replaced."
      discrepancy: "New-crop start: June per Produce World (fpj-parsnip-underdog) vs July per Huntapac (fpj-british-veg-roots), up to four weeks apart; both articles are undated and from different years. In starts at July, with June as avail. Source-age pass: the season-naming sources are old or undated (fpj-roots-differing-seasons 2004; FPJ pieces about 2012-15), with year-round supply from the 2016 Defra notices. The only newer source found, a wholesaler's July 2025 crop report, expected UK parsnips back toward the end of July (about wk 30-31), three to four weeks after the July start; it is secondary and covers one year, so dates not moved (freshview-crop-report-2025-07)."
      year_round: "On sale all year; at its best July–April. The rest of the year it's still easy to find, just not at its peak."
  confidence: medium
