# UK seasonality, one entry per food. Generated once by
# tools/make-foods.py, hand-edited, and merged with the 21 October 2026
# season bundle by tools/merge-bundle.py: this file is the truth.
#
# group: a key from _data/groups.yml.
# varieties: the food's rings, outermost first on its dial. A ring is a
#   named variety or type (Bramley, Cos), with its own colour, or a ring of
#   the food itself, which shares the food's colour (or its variety's):
# ring: region (a coast, a producer, a provenance), method (glasshouse,
#   outdoor, cultivated, wild), zone (a legal zone) or part (shoots,
#   flowers). Unset on a named variety or the food's one ring.
# method: on a `ring: method` ring, what it is: glasshouse, outdoor,
#   cultivated, wild, fresh, market or farmed. A glasshouse ring answers
#   as storage does (assets/verdict.js reads this key, never the name).
# lead: false on a ring that is shown (the food's dial and ring list) but
#   gives no calendar row, wheel dot or calendar event: every coast but a
#   fish's South West, a glasshouse, a wild ring beside a market one, a
#   provenance ring. Every ring counts towards the verdict, which answers
#   for the whole food (assets/verdict.js); a `method: glasshouse` ring
#   counts as storage does. Search finds a named variety with no `ring`
#   by its name and how it is said; a ring is never a search hit.
# weeks: [from, to, state] on a 52-week year (week 1 starts 1 January).
# state: in = in season, avail = just coming in or going out, store =
#   available from storage after the harvest (a week of storage alone is
#   YES-ISH, its date line "Available from storage until ...").
# colour: per food; a variety may carry its own colour to stand apart.
#   Every colour reaches 3.15:1 on both backgrounds, forcing shed #16110E
#   and custard #FBF3D9, because the verdict word is set in it. Pink
#   belongs to rhubarb alone: forced rhubarb is the brand pink, and no
#   other food sits near it. Palette from colours.yml, 21 Oct 2026.
# text_on_shed, text_on_custard: where colour falls short of 4.5:1 on a
#   background, the same hue at 4.6:1 there, for the food's name set in
#   its colour at text size (teasers, "Also:", every food link).
# shades: optional, two or three colours the season wheel sweeps through
#   across the in-season run (unripe, ripe, over), on a food or a
#   variety. The calendar keeps using colour.
# sources: on a food, every source its rings use; on a ring, its own.
#   Keys are in _data/sources.yml. A food not in the bundle keeps its one
#   older `source` (general = common knowledge, please check).
# note: optional, Helen's own note on the food. notes: the bundle's notes,
#   on a food or a ring, shown with the data.
# unsold: a food that cannot legally be sold here: always NO, its date
#   line this sentence (wild salmon).
# buy: optional, what to ask for at the counter; for fish, the Marine
#   Conservation Society's Good Fish Guide.
# said: optional, how a name is said mid-sentence. On a food, set it
#   where lower-casing the name is wrong: "John Dory", "Dover sole",
#   "Brussels sprouts" (unset, a food is its name in lower case). On a
#   variety, how it is said in full; unset, a variety is its name then
#   the food's: "Bramley apples", "Forced rhubarb". Set it when the name
#   is a noun on its own (Mooli, Calabrese, Mutton) or the phrase
#   hyphenates (New-season lamb).
# aliases: optional, other names a food is asked for by (zucchini). An
#   alias belongs to one food; tools/check-foods.py enforces it.
# also: optional, broader words a food should answer to as well, shared
#   between foods: every fungus answers to "mushrooms".
# short: optional, a calendar row's name on a phone (below 700px) and
#   nowhere else, 17 characters at most, in the plural sentence form
#   ("Bramley apples") and never an invented name. On a variety it is the
#   whole row's name ("Calabrese"); on a food it replaces the food's name
#   in its rows, a named variety still following in brackets.
# Variety names appear as written, mid-sentence too ("Venison Red &
# Fallow"), so proper nouns keep their capitals and the rest are lower-case
# after the first letter.
#
# PROPOSED by the clean-room seasonality research, 10 November 2026 (rules: rules.md).
# Added keys on a ring: confidence (high/medium/low); research (the line's
#   notes: season, discrepancy, drift, year_round, sustainability, unsold,
#   no_supply); mcs (Good Fish Guide ratings by stock and method) and buy
#   (what to ask for) on fish; no_supply (no regular UK supply of this ring);
#   proposed: true on a ring the research added (lead: false until promoted).
# A ring kept as Helen had it (no clean-room data) cites the food's sources if it
#   had none, and carries the research notes' sources in research.sources (and
#   sources searched without result in research.searched).
# If every lead ring of a food is no_supply or unsold, the first ring with weeks
#   leads instead (logged in CHANGES.md).
# On a food: confidence (low/medium/high: the weakest of its lead rings, the
#   ones that drive the verdict); never_candidate (not grown here; belongs in
#   never.yml); on fish, mcs: {read, best, worst, ratings} summarising every
#   Good Fish Guide rating across the food's rings (best and worst by score,
#   or by label where the MCS shows no number), or mcs: null with mcs_note.
# On meat: sustainability: {confidence, impact (Poore & Nemecek via OWID, and UK
#   figures where published), frameworks (what Eating Better, Pasture for Life,
#   RSPCA Assured and others say), notes (attributed, incl. contested points)};
#   buy from those third parties. No invented scores: third-party data only.
# Confidence on rings and foods: high/medium/low (rules.md's 'moderate' = medium).

