    - defra-wholesale-notice-2016-01
    - defra-wholesale-notice-2016-07
    - freshview-seasonality
    confidence: medium
    research:
      season: "Fresh harvest: a Suffolk grower supplying G's Fresh drills in March-April and lifts July to October, sending about a quarter straight to market and clamping the rest under straw to supply through the winter (countryside-foskett-beetroot). First UK crop of one season was lifted on 30 June (fpj-beetroot-season-underway), shown as avail. Store: Defra monthly wholesale notices quote home-grown beetroot in every month from Aug 2015 to Jul 2016 except January (defra-wholesale-notice-2016-01; defra-wholesale-notice-2016-07); with fresh lifting not starting until late June, the Nov-June supply must be stored crop. A supplier's calendar also lists UK beetroot all year (freshview-seasonality). On sale all year, fresh July-October and from store otherwise (defra-wholesale-notice-2016-07). The single avail week is the first lifting in late June, not a shortage."
      discrepancy: "Clamp storage is straw-covered field storage, not controlled storage; it is marked store because the roots are lifted and held, not left growing. The store end (wk 25) is inferred from the Defra quotes, not stated by a grower; no source says how long clamped or cold-stored UK beetroot lasts."
  confidence: medium
