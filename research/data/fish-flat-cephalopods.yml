      season: 'Rule 5, no named window (Helen''s decision, 2026-11-11): no source names a best-to-eat window for
        this line, so every landed week is in. No best-to-eat source for the eastern Channel (the CGSG months are
        for Cornwall), so no best-to-eat window. Landings: the MMO action plan monitors the Channel pot season at
        its start (April), middle (May) and end (July) (mmo-cuttlefish-action-plan); the MMO sampled Hastings in
        April 2025 during the potting season (mmo-cuttlefish-sampling-2025); fishers describe a short pot season
        of about two months, later in bad weather (mmo-cuttlefish-roadshow); Brighton and Newhaven boats join the
        cuttlefish fishery in spring as the weather warms, for about six to eight weeks (bnfs-fleet, 2020). Taken
        as April-July. Adults gather on south-coast inshore spawning grounds in spring (gov-sea4-cephalopods); Eastbourne
        is a landing port (guardian-cuttlefish). The winter trawl season in the MMO sampling was recorded at south-west
        ports, so it is not applied here. The Brighton & Newhaven Fish Sales seasonality chart (the SE landings
        source) is an image that could not be read (bnfs-seasonality).'
      discrepancy: Seafish says the south-coast trap fishery usually runs in summer and autumn, when cuttlefish
        come inshore to spawn (seafish-gear-cuttlefish-pots), against April-July from the MMO, a gap of more than
        four weeks. A University of Brighton project, run 2018-19, describes the Hastings fishery as seasonal and
        targeting the overwintering population, without months (brighton-sepia-hastings).
      drift: Fishers at the MMO roadshow reported rising water temperatures leading to earlier spawning and a longer
        fishing season (mmo-cuttlefish-roadshow).
