    notes:
      season: No North Sea best-to-eat source from 2021 on. A 2026 national market report says sole spawn April-June
        and advises avoiding them after March (directseafoods-spring-2026); the summer 2025 report says spawning
        is over by summer and quality should be excellent (directseafoods-summer-2025). Direct Seafoods' quarterly
        market reports are national, so their dates are applied to every region. So July-March is in. Northumberland
        Seafood says sole is available all year (northumberland-dover-sole, 2016), so April-June is avail. Northumberland
        Seafood's seasonality chart (the NE landings source) is an image that could not be read (northumberland-seafood-seasonality).
        ICES IVa-b.
      discrepancy: Northumberland Seafood says sole is at its best April-June (northumberland-dover-sole, 2016),
        the opposite of the 2026 report; the newer source is used. The spring 2025 report put best quality from
        May (directseafoods-spring-2025), against July here.
      year_round: Available all year (northumberland-dover-sole); best July-March, outside spawning (directseafoods-spring-2026).
        Avail here means out of its best season, not hard to get.
    mcs:
      read: 2026-11-10
      ratings:
      - stock: North Sea
        method: Bottom trawl (beam)
        rating: 2
        label: Best Choice
    buy: North Sea beam-trawled sole is rated Best Choice.
