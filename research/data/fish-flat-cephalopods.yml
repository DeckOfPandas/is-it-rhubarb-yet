    weeks:
    - - 1
      - 13
      - avail
    - - 14
      - 52
      - in
    notes:
      season: 'No regional best-to-eat source for this area. National market reports: plaice deteriorates towards
        the end of December as it roes up, spawns from the new year and is best avoided until spring (directseafoods-winter-2025);
        quality returns in April (directseafoods-spring-2026) and it is fully in season in summer (directseafoods-summer-2025).
        Direct Seafoods'' quarterly market reports are national, so their dates are applied to every region. Plaice
        is still sold in January-March, dearer and with poor fillet yields (directseafoods-spring-2025), so those
        weeks are avail. Northumberland Seafood gives spawning as mostly January-March but no landing months (northumberland-plaice,
        2016). Northumberland Seafood''s seasonality chart (the NE landings source) is an image that could not be
        read (northumberland-seafood-seasonality). ICES IVa-b.'
      discrepancy: 'The 2009 national guide, now background only, gave best May-January (seafish-seafood-guide):
        about four weeks later at the start, and January in, against the 2025-26 reports.'
      year_round: Sold all year; best April-December, outside the roe and spawning period (directseafoods-winter-2025,
        directseafoods-spring-2026). Avail here means out of its best season, not hard to get.
    mcs:
      read: 2026-11-10
      ratings:
      - stock: North Sea, Skagerrak
        method: Bottom trawl (otter)
        rating: 2
        label: Best Choice
      - stock: North Sea, Skagerrak
        method: Bottom trawl (beam)
        rating: 2
        label: Best Choice
    buy: North Sea plaice is the MCS's Best Choice, otter- or beam-trawled.
