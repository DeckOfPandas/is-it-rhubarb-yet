      season: 'Wild penny bun fruits summer to autumn (woodlandtrust-penny-bun), the highest-ranked source, so its
        season sets the in window, read as Jul-Oct under the convention used for herbs: an open start or end is
        the middle month of the season. A wholesaler lists UK ceps as in season in October and the UK wild mushroom
