        converted as: a named season is its full months (spring Mar-May, summer Jun-Aug, autumn Sep-Nov); early,
        mid and late mean its first, middle and last month; an open start or end such as from spring or to autumn
        is taken as the middle month (Apr, Oct).'
      discrepancy: Category-wide window Apr-Sep, with Mar and Oct as shoulders (fpj-herbs-uk-kitchens), runs about
        9 weeks earlier and 4 weeks later than the basil-specific dates.
