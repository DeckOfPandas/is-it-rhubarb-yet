        with Opal, by 1 Aug 2025 (ncgm-august-2025), which fits these weeks. Defra''s 2026 wholesale series groups
        every plum except Victoria together, quoted 20 Jul to 12 Oct 2026 (defra-wholesale-prices), so it cannot
        date Opal.'
      discrepancy: In the late 2015 season Total Worldfresh said Opal had started only about 10 August (freshplaza-plums-2015),
        about three weeks after the mid-July start.
