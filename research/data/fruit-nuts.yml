    notes:
      season: 'Second pass: dates now follow BAPL''s season page, late December to May (bapl-british-season), because
        English Apples & Pears (BAPL''s predecessor) said British Braeburn is not fit to eat until mid-December,
        at the very earliest the end of November (fpj-eap-braeburn), and Worldwide Fruit said it was hard to market
        before December, when it reaches eating quality after time in store (fpj-braeburn). Those trade sources
        (about 2005 to 2008) put sales after storage; Defra''s 2026 quotes (see discrepancy) now set the weeks.
        Coordinator, 2026-11-10: availability-only rule applied (rules.md, rule 2). The season named by growers
        or guides sets `in`; weeks resting only on Defra''s 2026 wholesale quotes are `avail` (or `store`).'
      discrepancy: 'BAPL contradicts itself: its varieties page gives November to May (bapl-apple-varieties), about
        seven weeks earlier than its season page. Two other sources are earlier still: Sainsbury''s and Worldwide
        Fruit offered all-English Braeburn in October in one year (fpj-sainsburys-braeburn), and New Covent Garden
        expected first Braeburns later in October 2025, in a season running two weeks early (ncgm-october-2025).
        Sources span more than four weeks, so confidence stays low. Source-age pass: Defra''s wholesale series quoted
        home-grown Braeburn from 24 Nov 2025 (the first date in the preview) through to 17 Aug 2026, then again
        on 26 Oct 2026 after a gap (defra-wholesale-prices). Those quotes run eleven weeks past BAPL''s May end
        and start four weeks before its late-December start, so the store range now runs to week 33 and from week
        44, and the single new-season October quote is in, as October is fresh harvest elsewhere in this group.
        The fpj sources on late eating quality date from about 2005 to 2008.'
