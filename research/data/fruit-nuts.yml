        line is now low. No newer source for UK fig supply was found: about 2020 an Essex grower was still trialling
        figs, with harvests in August and November and no sales mentioned (fpj-uk-figs-trial), and New Covent Garden''s
        July to October 2025 reports list only imported figs. Whether the Abbey View supply continues is unresolved;
        this may be a no_supply candidate.'
