      season: 'Line renamed from Figs (whole) to Glasshouse (method) under rule 6: the only UK commercial source
        is Abbey View Produce, which grows figs in unheated greenhouses in the south-east for Sainsbury''s. In 2013
        they went on sale in early August, in very small volumes (freshplaza-figs-2013); Sainsbury''s expected the
        season to last to early October (fpj-figs-sainsburys). No peak named, so the whole window is in. The FreshPlaza
