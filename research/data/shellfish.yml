      read: 2026-11-10
      ratings:
      - stock: 'England (Southern North Sea): Offshore (beyond 6nm)'
        method: Pot, trap or creel
        rating: 4
        label: OK
    buy: Eastern IFCA inshore pot-caught crab is under review by the MCS; offshore Southern North Sea pot-caught
      crab is OK but needs improvement. Landing berried or soft crab is banned in England.
