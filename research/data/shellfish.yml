        best-quality months (dalegate-brancaster-mussels, fitd-mussels). The Wash dredge notice gives an opening
        date only (eifca-wash-mussel-dredge-2025). No Eastern IFCA page giving SE months was found.
      sustainability: MCS (read 2026-11-10) has no rating for wild Wash or Norfolk mussels; its UK ratings cover
        farmed rope-grown mussels, Northern Ireland and Poole Harbour (mcs-blue-mussel).
