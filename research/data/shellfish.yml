    weeks:
    - - 1
      - 8
      - avail
    - - 9
      - 26
      - in
    - - 27
      - 52
      - avail
    notes:
      season: 'In = best to eat: Seafish''s consumer guide gives March-June as best quality for brown crab, UK-wide
        (fitd-crab); Amble''s Northumberland Seafood says local crab is at its best in spring (northumberland-seafood-brown-crab).
        Avail = landings: Northumberland Seafood says crab is generally in season April-November (northumberland-seafood-brown-crab);
        MCS gives May-December as the key UK fishing season (mcs-brown-crab-northumberland); Northumberland IFCA
        quarterly landings for ICES IVb show crab landed in every quarter, with Q4 the largest and Q2-Q3 the smallest
        in 2020-22 (nifca-crab-2023). The Northumberland Seafood seasonality chart is an image the research tools
        could not read (northumberland-seafood-seasonality). Shetland is ICES IVa.'
      discrepancy: The landings sources put the busiest fishing in May-December (mcs-brown-crab-northumberland)
        and the biggest landings in Q4 (nifca-crab-2023), while the best-quality window is March-June (fitd-crab).
        The same Seafish page also says fresh crab is best enjoyed April-October; its labelled best-quality months
        are used.
      year_round: Landed all year in the North East (nifca-crab-2023); best quality March-June, before the summer
        and autumn moult (fitd-crab). Avail here means out of its best season, not hard to get.
    mcs:
      read: 2026-11-10
      ratings:
      - stock: 'Scotland (Shetland): All areas'
        method: Pot, trap or creel
        rating: 2
        label: Best Choice
      - stock: 'England (Central North Sea): Northumberland IFCA District (0-6nm)'
        method: Pot, trap or creel
        rating: 4
