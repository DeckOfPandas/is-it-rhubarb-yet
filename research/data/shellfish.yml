        method: Pot, trap or creel
        rating: 4
        label: OK
      - stock: 'Scotland (Orkney): All areas'
        method: Pot, trap or creel
        rating: 4
        label: OK
    buy: MSC-certified pot-caught Shetland crab is the Best Choice. Pot-caught crab from Northumberland, Yorkshire
