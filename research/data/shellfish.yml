    notes:
      season: 'Split added: the southern North Sea, ICES IVc, North Norfolk, has a spring fishery, unlike the Eastern
        Channel. In = best to eat: Seafish gives March-June as best quality, UK-wide (fitd-crab). Avail = landings:
        Cefas says the spring fishery, March-May, has the highest catch rates and crab availability drops through
        summer (cefas-crab-assessments-2019). The c. 1966 MAFF leaflet gives a season from late March or early April
        to late September or early October, with the main moult July-October, poor catches while crabs are soft,
        and winter crabbing generally unprofitable (maff-norfolk-crab). No current source on Norfolk winter landings
        was found, so October-February has no weeks.'
      discrepancy: Not resolved. Cefas (2021 update) gives March-May as the highest-catch spring fishery, but for
        the Southern North Sea stock as a whole, not Norfolk alone (cefas-crab-assessments-2019). MAFF (c. 1966,
        Norfolk-specific) puts the catch peak in May-June (maff-norfolk-crab). Both are landings statements; the
        in window rests on fitd-crab. No current Eastern IFCA seasonal data was found.
