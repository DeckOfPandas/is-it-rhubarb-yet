      season: 'Wild-bed mussels from the Wash and North Norfolk, ICES IVc. In = best to eat: Seafish''s consumer
        guide gives January-March and October-December as best quality, and says mussels spawn in spring and have
        less meat then (fitd-mussels); The Grocer, quoting Seafish, also says mussels are fattest in winter (grocer-mussels).
        Avail = landings: Seafish says mussel dredging runs August-May, UK-wide (fitd-mussels). A Brancaster retailer
        says local mussels are sold in the months with an R, roughly September-April (dalegate-brancaster-mussels;
        also saveur-norfolk-mussels). The Wash harvestable dredge fishery opened on 29 January 2025 (eifca-wash-mussel-dredge-2025).
