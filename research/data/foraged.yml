    - name: "Wood sorrel"
      kind: whole
      confidence: low
      sources: [galloway-wood-sorrel, countryfile-wood-sorrel, wildfooduk-wood-sorrel, fcc-wood-sorrel, wt-wood-sorrel, wildlifewatch-wood-sorrel]
      weeks:
        - [1, 8, avail]
        - [9, 22, in]
        - [23, 52, avail]
      notes:
        season: "Most abundant March to November with the best flavour in spring (galloway-wood-sorrel), mapped to Mar-May; found all year in Galloway though sparse in a long winter, and dies back in colder northern areas. Listed January to December (wildfooduk-wood-sorrel). Best foraged in spring and summer, at its peak early to mid spring (countryfile-wood-sorrel). WT gives flowering April-May (wt-wood-sorrel) and Wildlife Watch April-May for spotting (wildlifewatch-wood-sorrel), but neither gives a harvest window; second pass also searched the National Trust, Forestry England, Plantlife and Sheffield and Rotherham Wildlife Trust without finding one. Secondary sources only."
        year_round: "Found all year in mild areas (galloway-wood-sorrel, wildfooduk-wood-sorrel); spring (Mar-May) has the best flavour, so avail outside it means past its best or sparse, not absent."

