      weeks:
        - [27, 39, in]
      notes:
        season: "Can ripen around the start of July and continue into August and September (wt-foraging-jul). Wildlife Trusts say summer and early autumn are the best time to find bilberry, with bushes covered in fruit by August (wildlifetrusts-bilberry). In season July to September on the hills (ukh-hill-berries). Line renamed from 'Bilberries' (kind whole) when the Scotland split was added."
    - name: "Scotland"
      kind: region
      confidence: moderate
      sources: [tfl-blaeberry, obantimes-blaeberry, visitcairngorms-foraging]
      weeks:
        - [27, 35, in]
        - [36, 39, avail]
      notes:
        season: "Split added because Scottish sources treat blaeberry separately. Trees for Life (a Highland conservation charity) says the berries ripen in July and August (tfl-blaeberry). A Hebridean column quotes A Handbook of Scotland's Wild Harvests as giving ripe berries July to September, and found the first ripe berry on Lewis on 1 August (obantimes-blaeberry); September shown as avail. Neither source gives altitude or north-south differences, so no finer split is possible. It starts the same week as the UK-wide line and ends earlier only because the primary source stops at August."
        discrepancy: "visitcairngorms-foraging (2015) says late summer and autumn (August-November, weeks 31-48), later than tfl-blaeberry's July-August (27-35)."

