- name: "Dandelion"
  slug: dandelion
  group: foraged-wild
  lines:
    - name: "Dandelion"
      kind: whole
      confidence: low
      sources: [wt-foraging-feb, wt-foraging-mar, wt-foraging-jun, lovecairngorms-spring, totallywild-dandelion, courier-foraging-may, natgeo-calendar]
      weeks:
        - [1, 8, avail]
        - [9, 22, in]
        - [23, 52, avail]
      notes:
        season: "Appears from February; young leaves from the rosette centre are best, outer leaves bitter (wt-foraging-feb, wt-foraging-mar); still listed in June (wt-foraging-jun). Pickable any time of year but most tender in spring (lovecairngorms-spring), mapped to Mar-May; fresh early spring growth is best (totallywild-dandelion). North of Scotland: March to November (courier-foraging-may). No source found that sets a before-flowering cut-off for the leaves, so none applied. WT gives the first appearance but no best window, so the 'in' window rests on secondary sources; second pass searched the Woodland Trust (March, April, May posts), The Wildlife Trusts and Plantlife without finding one."
        year_round: "Leaves can be picked all year (lovecairngorms-spring); spring (Mar-May) is when they are most tender, so avail outside it means past their best, not hard to find."
        discrepancy: "natgeo-calendar gives a June peak (weeks 23-26), probably for flowers."

- name: "Sea beet"
  slug: sea-beet
  group: foraged-wild
