# Is It Rhubarb Yet? — clean-room seasonality, group: foraged (researched 2026-11-10)
# Weeks per rules.md: Jan 1-4, Feb 5-8, Mar 9-13, Apr 14-17, May 18-22, Jun 23-26,
# Jul 27-30, Aug 31-35, Sep 36-39, Oct 40-43, Nov 44-48, Dec 49-52.
# Seasons named only as "spring/summer/autumn/winter" are mapped to meteorological months
# (spring Mar-May, summer Jun-Aug, autumn Sep-Nov, winter Dec-Feb); notes say where.

- name: "Wild garlic"
  slug: wild-garlic
  group: foraged-wild
  lines:
    - name: "UK-wide"
      kind: region
      confidence: moderate
      sources: [wt-wild-garlic, wt-foraging-feb, wt-foraging-mar, wt-foraging-apr, srwt-wild-garlic, wt-wild-garlic-pesto, natgeo-calendar, caterer-wild-garlic]
      weeks:
        - [5, 8, avail]
        - [9, 13, in]
        - [14, 26, avail]
      notes:
        season: "Leaves can appear from February (wt-foraging-feb); leaves come up in March and are best young (srwt-wild-garlic). Leaves are best before flowering (wt-wild-garlic), and flowers open from April, so April onwards is avail; WT says pick before the flowers die, usually by early May (wt-foraging-mar), and woods carry it to June (srwt-wild-garlic)."
        discrepancy: "wt-wild-garlic-pesto says visit woods late March to July (weeks 12-30). natgeo-calendar puts the peak in April (14-17). caterer-wild-garlic says growth starts in Cornwall in late December and runs about 12 weeks, about two weeks later per degree north."
    - name: "Scotland"
      kind: region
      confidence: low
      sources: [lovecairngorms-spring, spurtle-wild-garlic, galloway-wild-garlic, scotsman-wild-garlic, nts-wild-garlic, caterer-wild-garlic, naturescot-foraging-plants]
      weeks:
        - [5, 13, avail]
        - [14, 17, in]
        - [18, 26, avail]
      notes:
        season: "Split added: Scottish sources give a later peak than the UK-wide line. Cairngorms: late winter to end of spring, peaking in April, flowering around May (lovecairngorms-spring). Edinburgh: first shoots late February, April and May the best months, starting to rot by June (spurtle-wild-garlic). Galloway: shoots obvious from early February, season February to June, leaves past their best once flowering in May (galloway-wild-garlic). Shows from February at NTS properties (nts-wild-garlic); arrives in Scotland around April (caterer-wild-garlic). The April peak is where all the Scottish sources overlap. Second pass found no primary source (searched NatureScot, Scottish Wildlife Trust, Woodland Trust Scotland, Forestry and Land Scotland); NatureScot's foraging guide says only that leaves appear in spring (naturescot-foraging-plants), too vague to set weeks. Otherwise secondary sources only."
        discrepancy: "spurtle-wild-garlic names April and May as best (weeks 14-22), against April only in lovecairngorms-spring (14-17). scotsman-wild-garlic gives growth March to May (9-22)."

