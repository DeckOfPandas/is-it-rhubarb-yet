        - [14, 26, in]
      notes:
        season: "Earliest conifer growth, usually April to June in the UK, is soft enough to eat; spruce tips picked in spring are softest, and an April photo shows tips about to shed their sheath (galloway-conifers). A Hampshire picking for spruce beer took place in late May or June (rab-spruce-beer); a June 2013 post describes the new growth as full-sized but still soft then (woodlandways-spruce-beer). No primary source found; second pass searched the Woodland Trust, Forestry England, the Wildlife Trusts and Scottish distillers using spruce tips without finding a harvest window."
