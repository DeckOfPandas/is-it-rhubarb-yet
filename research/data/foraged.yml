        season: "Edible all year, best in spring (naturescot-foraging-plants, wildfooduk-sea-beet, fcc-sea-beet); spring mapped to Mar-May. Leaves turn bitter while flowering, late spring through summer, and recover in autumn (galloway-sea-beet); Wildlife Trusts give flowering July-September (wildlifetrusts-sea-beet, kentwt-sea-beet). Can be below par in January-February in the north, and largely absent from Scotland's west, north and north-east coasts (galloway-sea-beet)."
        discrepancy: "galloway-sea-beet gives flowering as May-August, Wildlife Trusts July-September."
        year_round: "Edible all year (naturescot-foraging-plants, wildfooduk-sea-beet); spring (Mar-May) is best, before flowering makes the leaves bitter (galloway-sea-beet), so avail outside it means past its best, not hard to find."

- name: "Samphire"
  slug: samphire
  group: foraged-wild
  lines:
    - name: "Marsh samphire (wild)"
      kind: variety
      confidence: low
      sources: [galloway-marsh-samphire, cpre-norfolk-samphire, klmag-samphire, riverford-donald-watson, riverford-foraging-mud, vice-samphire, wildwalks-marsh-samphire, fcc-marsh-samphire, wildlifetrusts-glasswort, farminguk-samphire, countryfile-monthly]
      weeks:
        - [18, 22, avail]
        - [23, 31, in]
        - [32, 35, avail]
      notes:
        season: "Juiciest in June and July; May shoots are tender but hard work to gather (galloway-marsh-samphire). Norfolk season usually June into early August (cpre-norfolk-samphire); in Norfolk it appears late June or early July and lasts to the end of August, best early before the stems go woody (klmag-samphire). Goes woody later in the year (fcc-marsh-samphire, wildwalks-marsh-samphire). Commercial hand-gathered supply: Riverford's team cuts wild samphire by hand on the Erme estuary salt marsh in Devon, an SSSI, under Natural England permission, for a few weeks each summer, about a month's work (riverford-donald-watson); in 2022 they had been picking for the month before 7 July, so roughly June (riverford-foraging-mud). A Wells-next-the-Sea restaurant buys Norfolk samphire from local fishermen and serves it June to September (vice-samphire). Waitrose describes the traditional British season as about 12 weeks in summer (farminguk-samphire). Wildlife Trusts give flowering August-September and note it is an offence to uproot a wild plant (wildlifetrusts-glasswort). No harvest window from a primary source; searched Natural England, the Crown Estate and the Norfolk, Lincolnshire and Essex Wildlife Trusts in the second pass without finding one."
        discrepancy: "wildwalks-marsh-samphire gives the peak as June-August (weeks 23-35); klmag-samphire late June or early July to end of August (26-35); vice-samphire has a restaurant serving it June-September (23-39), though sellers called it woody by the end of August. countryfile-monthly lists marsh samphire under December, which no other source supports."
    - name: "Rock samphire"
      kind: variety
      confidence: low
      sources: [wildwalks-rock-samphire, galloway-rock-samphire, wildfooduk-rock-samphire]
      weeks:
        - [18, 26, in]
        - [27, 43, avail]
      notes:
        season: "Split added: a different, unrelated species with a longer season. Late spring or early summer is the best time to pick; in late summer only the young fronds, avoiding the flowering stems (wildwalks-rock-samphire); late spring and early summer mapped to May-June. Season May to September (galloway-rock-samphire), where a reader comment also advises spring or early summer before it toughens; May to October (wildfooduk-rock-samphire). Rare in Scotland except Galloway and South Ayrshire (galloway-rock-samphire). Secondary sources only; no primary source found."
        discrepancy: "galloway-rock-samphire gives the whole of May-September (weeks 18-39) with no peak; wildfooduk-rock-samphire runs to October (week 43)."
    - name: "Glasshouse (hydroponic)"
      kind: method
      confidence: moderate
      sources: [fpj-samphire, grocer-samphire, farminguk-samphire, westlands-samphire]
      weeks:
        - [1, 52, in]
      notes:
        season: "Split added: Westlands grows marsh samphire hydroponically under glass, supplying Waitrose year-round (fpj-samphire, grocer-samphire, farminguk-samphire, June 2026). Production window given with no peak, so in throughout (rule 6, revised; first pass had avail). Westlands' own page (16 June 2026) says 'most of the year', with year-round supply still at trial stage (westlands-samphire). Commercially hand-gathered wild supply is covered on the wild line."
        discrepancy: "Trade press reports year-round supply; the grower's own page says most of the year, with year-round still on trial (westlands-samphire). No months of any gap are given."

