    notes:
      season: 'Scottish pelagic fleet has two seasons. Winter: the January fishery west of Shetland and north-west
        of Orkney, mostly over by the first week of February, with good-sized, high-quality fish (fishfocus-mackerel-2025,
        quoting the SPFA vice-chairman; fishfocus-mackerel-2024). Autumn: October to mid-November in the North Sea
        and around Shetland (fishfocus-mackerel-2024, worldfishing-mackerel-2023); in Nov 2025 the SPFA reported
        abundant fish west of Shetland, landed at Lerwick in premium condition (fishfocus-mackerel-autumn-2025);
        one season ran from 30 Sep, peaked in early November and was over by the end of November (fishingdaily-mackerel-autumn),
        hence late-November avail. Avail Apr-Sep: Northumberland Seafood says mackerel arrive in UK waters in spring
        and early summer and move off to spawn in autumn (northumberland-mackerel); a small-boat handline fishery
        in Shetland, Orkney and the Moray Firth is managed to stay open 12 weeks or more over the summer (govscot-inshore-mackerel-review).
        Northumberland Seafood''s seasonality chart is an image not legible as text (northumberland-seasonality).
        ICES IVa and VIa.'
      discrepancy: northumberland-mackerel (2016, secondary) puts the peak in July, in the inshore summer fishery;
        the SPFA-quoted trade sources (higher rank) name Jan-early Feb and Oct-Nov for the pelagic fleet, so July
        is avail here. seafish-seafood-guide (2009) is background only under the fish brief (all year, best Jun-Aug);
        its all-year avail was dropped, leaving Feb-Mar and December empty.
    mcs:
      read: 2026-11-10
      ratings:
      - stock: Northeast Atlantic and adjacent waters
        method: pelagic trawl or purse seine, all areas
        rating: 5
        label: Avoid
