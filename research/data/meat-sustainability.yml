# Meat and game sustainability and environmental impact (researched 2026-11-10)
# Third-party data only: every figure, tier and buying line is attributed to a named body.
# No scores or tiers of our own. Source keys resolve in sources/meat-sustainability.yml.
#
# Statistics: OWID's Poore & Nemecek charts give global MEANS (owid-ghg-per-kg, owid-ghg-per-protein,
# owid-land-use-per-protein). Medians appear only in OWID articles: per 100 g protein in owid-less-meat
# (2020) and, per kg, in the old supply-chain chart quoted in owid-faq-impacts and
# owid-environmental-impacts, which excluded supply-chain losses. Each block says which is which.
# Units differ: OWID is per kg of food product; UK farm studies are per kg deadweight (carcase),
# cradle to farm gate. They are not directly comparable.

- slug: lamb
  impact:
    ghg_kg_co2e_per_kg:
      category: "Lamb & Mutton"
      median: null
      source: owid-environmental-impacts
      median_note: "No exact per-kg median found. OWID's text, based on its earlier median supply-chain chart, says only that lamb emits more than 20 kg CO2e per kg."
      mean: 39.72
      mean_source: owid-ghg-per-kg
    ghg_per_100g_protein:
      category: "Lamb & Mutton"
      median: 20
      source: owid-less-meat
      median_note: "OWID's chart shows medians; its alt text describes lamb as around 20 kg CO2e. Lowest-impact tenth of producers: 12 kg CO2e."
      p10: 12
      mean: 19.85
      mean_source: owid-ghg-per-protein
    land_use_m2_per_kg: null
    land_use_note: "No per-kg land-use value for Lamb & Mutton could be read. Per 100 g protein, OWID's mean is 184.8 m2, the highest of any food it lists (owid-land-use-per-protein)."
    land_use_m2_per_100g_protein: {mean: 184.8, category: "Lamb & Mutton", source: owid-land-use-per-protein}
    uk:
      - figure: 22.3
        unit: "kg CO2e per kg deadweight (average)"
        system: "354 farms supplying ABP, mostly UK beef and sheep farms (Prism programme, with Andersons Centre and Harper Adams); farm results ranged from under 10 to over 55"
        source: fwi-prism-2024
      - figure: "21.8 to 36.4"
        unit: "kg CO2e per kg deadweight, cradle to farm gate (Agrecalc)"
        system: "Welsh lowland and upland lamb, 33 farms, by finishing diet; concentrate-finished averaged 25.0, grass-finished 28.1"
        source: frontiers-welsh-lamb-2024
  frameworks:
    - body: "Eating Better (Sourcing Better, 2021)"
      says: "Uses Basic, Better and Best tiers across eight impact areas, but names no certification for lamb or sheep at any tier; sheep appear only in the antibiotics section."
      source: eatingbetter-sourcing-better-2021
    - body: "Eating Better (Sourcing Better 2.0, 2026)"
      says: "Keeps the Basic, Better and Best tiers and adds on-farm practice criteria; species detail not read, as the PDF would not load."
      source: eatingbetter-sourcing-better-2026
    - body: "Pasture for Life"
      says: "Certifies ruminant meat from animals fed only on pasture and conserved forage, with no grain or manufactured feed; farms are audited by an independent body and already meet farm assurance standards."
      source: pfl-standards-page
    - body: "RSPCA Assured"
      says: "Has a sheep welfare standard: grazing must supply most of the diet, sheep are shorn at least yearly, and newborn lambs must get colostrum."
      source: rspca-higher-welfare
  buy: "Look for Pasture for Life certification, meaning lamb fed wholly on grass and forage, or RSPCA Assured lamb, which is reared under the RSPCA's sheep standard (pfl-standards-page, rspca-assured-standards)."
  notes:
    - topic: diet
      text: "The Climate Change Committee's Seventh Carbon Budget calls for meat eating to fall 25% by 2040 and 35% by 2050, with beef and lamb down 40%. AHDB disputes that a sustainable food system needs less meat."
      source: ahdb-ccc-less-meat
    - topic: method
      text: "The Welsh study's authors say comparing lamb per kg can mislead: once omega-3 content is counted, the lowest-footprint finishing system changes."
      source: frontiers-welsh-lamb-2024
    - topic: certification
      text: "Pasture for Life's current standard is version 5.1, covering ruminant livestock and their products."
      source: pfl-standards-5-1
    - topic: lines
      text: "OWID's category Lamb & Mutton covers lamb and mutton together."
      source: owid-ghg-per-kg
  research_note: "No source found gives separate figures for new-season, milk-fed, hogget, salt marsh or mutton lines. The only Welsh-specific figure is the Bangor/HCC study (frontiers-welsh-lamb-2024)."
  confidence: high

- slug: beef
  impact:
    ghg_kg_co2e_per_kg:
      category: "Beef (beef herd)"
      median: 60
      source: owid-faq-impacts
      median_note: "From OWID's earlier supply-chain chart, which showed the median but left out supply-chain losses; OWID made the chart a mean, with losses included, on 15 June 2022."
      mean: 99.48
      mean_source: owid-ghg-per-kg
      also:
        - {category: "Beef (dairy herd)", mean: 33.3, source: owid-ghg-per-kg}
    ghg_per_100g_protein:
      category: "Beef"
      median: 25
      source: owid-less-meat
      median_note: "OWID says the median for beef is 25 kg CO2e, with the lowest-impact tenth below 9 and the highest tenth above 105. The article does not say which herd; it gives a mean of about 35, which matches neither grapher mean below, so it appears to pool the two."
      p10: 9
      p90: 105
      mean: 49.89
      mean_source: owid-ghg-per-protein
      also:
        - {category: "Beef (dairy herd)", mean: 16.87, source: owid-ghg-per-protein}
    land_use_m2_per_kg: {mean: 326, category: "Beef (beef herd)", source: statista-land-use-per-kg}
    land_use_m2_per_100g_protein: {mean: 163.6, median: 104, category: "Beef (beef herd)", source: owid-land-use-per-protein, median_source: owid-less-meat}
    uk:
      - figure: 26.2
        unit: "kg CO2e per kg deadweight (average)"
        system: "354 farms supplying ABP (Prism programme); farm results ranged from under 10 to over 55"
        source: fwi-prism-2024
  frameworks:
    - body: "Eating Better (Sourcing Better, 2021)"
      says: "Basic: Red Tractor or UK legal minimum. Best: Pasture for Life, Soil Association organic, RSPCA Assured free-range or organic, or pasture-reared and extensive systems with strong welfare monitoring. Names nothing at Better."
      source: eatingbetter-sourcing-better-2021
    - body: "Eating Better (Sourcing Better 2.0, 2026)"
      says: "Keeps Basic, Better and Best and adds on-farm practice criteria; species detail not read, as the PDF would not load."
      source: eatingbetter-sourcing-better-2026
    - body: "Pasture for Life"
      says: "Certifies ruminant meat from animals fed only on pasture and conserved forage, with no grain, soya or manufactured feed; farms are independently audited."
      source: pfl-standards-page
    - body: "RSPCA Assured"
      says: "Has a beef cattle welfare standard; the RSPCA says cattle on its farms graze outdoors at least four hours a day in spring and summer."
      source: rspca-higher-welfare
  buy: "Eating Better's Best tier for beef is Pasture for Life, Soil Association organic, or RSPCA Assured free-range or organic; Red Tractor alone is its Basic tier (eatingbetter-sourcing-better-2021)."
  notes:
    - topic: contested
      text: "In May 2026 the ASA upheld Chris Packham's complaint about an AHDB ad claiming British beef has half the global average carbon footprint: the evidence AHDB cited (Poore & Nemecek's cradle-to-retail meta-analysis) did not support the ad's 'full lifecycle' wording. The ASA rejected the complaint's other points, including on grazing imagery."
      source: asa-ahdb-2026
    - topic: housing
      text: "The ASA's ruling quotes Defra's 2019 survey: 87% of UK cattle farms mix housing and grazing, 9% graze all year, and 4% house cattle all year."
      source: asa-ahdb-2026
    - topic: diet
      text: "The CCC's Seventh Carbon Budget calls for beef and lamb eating to fall 40% by 2050; AHDB argues production should become more sustainable instead."
      source: ahdb-ccc-less-meat
    - topic: spread
      text: "Poore and Nemecek report that 90th-percentile beef emits 105 kg CO2e per 100 g protein, about 12 times 10th-percentile dairy beef."
      source: poore-nemecek-2018
    - topic: dairy-beef
      text: "OWID says beef from dairy herds has about 60% lower emissions because its footprint is shared with dairy co-products."
      source: owid-environmental-impacts
  confidence: high

- slug: pork
  impact:
    ghg_kg_co2e_per_kg:
      category: "Pig Meat"
      median: 7
      source: owid-environmental-impacts
      median_note: "OWID text gives pork at 7 kg CO2e per kg. The figure comes from its earlier supply-chain chart, which OWID's FAQ says showed medians and left out supply-chain losses (owid-faq-impacts)."
      mean: 12.31
      mean_source: owid-ghg-per-kg
    ghg_per_100g_protein:
      category: "Pig Meat"
      median: 6.5
      source: owid-less-meat
      median_note: "OWID's chart shows medians, although its alt text calls 6.5 an average. Lowest-impact tenth: 4.5; highest-impact: 14."
      p10: 4.5
      mean: 7.61
      mean_source: owid-ghg-per-protein
    land_use_m2_per_kg: null
    land_use_note: "Per-kg value for Pig Meat could not be read; OWID's mean per 100 g protein is 10.7 m2."
    land_use_m2_per_100g_protein: {mean: 10.7, category: "Pig Meat", source: owid-land-use-per-protein}
    uk: []
    uk_note: "No absolute UK pork figure was found. A peer-reviewed Queen's University Belfast study using AHDB data reports that the global warming potential of British pig production fell 37.0% for indoor-bred pigs and 35.4% for outdoor-bred pigs between 2000 and 2020 (pigworld-pig-carbon-2021)."
  frameworks:
    - body: "Eating Better (Sourcing Better, 2021)"
      says: "Basic: UK minimum or Red Tractor. Better: RSPCA Assured indoor, or organic. Best: free-range or organic (Soil Association), or RSPCA Assured free-range or organic."
      source: eatingbetter-sourcing-better-2021
    - body: "RSPCA"
      says: "Recommends RSPCA Assured pork: no farrowing crates, and pigs get space and straw, plus mud to wallow in when kept outdoors."
      source: rspca-higher-welfare
    - body: "RSPCA Assured"
      says: "Red Tractor is mainly about food safety and traceability, not welfare, and its sows may still be kept in farrowing crates; free range is not legally defined for pigs."
      source: rspca-assured-labels
  buy: "Look for free-range or organic pork, or RSPCA Assured; Eating Better puts free-range and organic in its Best tier and RSPCA Assured indoor in Better (eatingbetter-sourcing-better-2021, rspca-higher-welfare)."
  notes:
    - topic: labels
      text: "Free range has a legal definition only for eggs and poultry, so outdoor claims on pork vary in meaning."
      source: rspca-assured-labels
  confidence: moderate

- slug: chicken
