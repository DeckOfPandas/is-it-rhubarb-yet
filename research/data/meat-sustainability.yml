- slug: grouse
  impact: null
  impact_note: "No figure of its own and no source-named proxy."
  frameworks:
    - body: "None"
      says: "No UK framework found rates grouse or other wild game; Eating Better's framework covers farmed animals only."
      source: eatingbetter-sourcing-better-2021
  buy: "From April 2029 lead shot may not be used for live quarry (basc-lead-restrictions-2026); until then the FSA advises frequent eaters of lead-shot game, and especially children and pregnant women, to cut down (fsa-lead-shot-game)."
  notes:
    - topic: lead
      text: "All 78 red grouse carcasses from the 2024/25 season examined in an RSPB-part-funded Cambridge and UHI study had been shot with lead."
      source: shootinguk-lead-study-2025
    - topic: lead
      text: "FSA advice on lead-shot game includes red and black grouse."
      source: fsa-lead-shot-game
    - topic: grouse-moors
      text: "The RSPB says it is neutral on the ethics of shooting but cites raptor persecution, burning on peat and lead shot; it wants grouse shooting licensed in England, as it now is in Scotland, rather than banned."
      source: rspb-grouse-debate-2025
    - topic: grouse-moors
      text: "The Moorland Association says managed grouse moors hold over half of the UK's curlews, that controlled cool burning reduces wildfire risk, and that managers have blocked over 7,000 km of drains; it opposes both a ban and licensing."
      source: moorland-assoc-briefing-2025
    - topic: grouse-moors
      text: "GWCT cites its studies (Langholm, Berwyn, the Uplands Predation Experiment) as showing that moor management and predator control help lapwing, curlew and golden plover, and condemns illegal raptor persecution."
      source: gwct-grouse-debate-2025
  confidence: moderate

- slug: pheasant
  impact: null
  impact_note: "No figure of its own and no source-named proxy."
  frameworks:
    - body: "Code of Good Shooting Practice"
      says: "Treats all shot game as food; follows GWCT guidance of no more than 1,000 pheasants per hectare of release pen (700 in ancient semi-natural woodland), and pens on no more than about a third of a shoot's woodland."
      source: code-good-shooting-practice
  buy: "Lead shot for live quarry is banned from 1 April 2029 (basc-lead-restrictions-2026); until then the FSA advises frequent eaters of lead-shot pheasant, and especially children and pregnant women, to cut down and to ask the supplier how the game was shot (fsa-lead-shot-game)."
  notes:
    - topic: lead
      text: "The 2020 pledge by nine UK shooting and rural organisations to drop lead shot by 2025 was not met: 99% of 171 pheasants bought in 2025 had been shot with lead, against 93% to 94% in 2022 to 2024."
      source: cam-lead-pledge-2025
    - topic: lead
      text: "BASC replied that significant progress had been made, citing more than 150 non-lead cartridges on sale."
      source: shootinguk-lead-study-2025
    - topic: lead
      text: "The restriction is now law under UK REACH (in force 1 April 2026): from 1 April 2029, lead shot may not be sold or used for live quarry."
      source: shootinguk-lead-ban-2026
    - topic: releases
      text: "Natural England's 2020 evidence review cites estimates of 39 to 57 million pheasants released in the UK each year, about 85% of them in England."
      source: ne-gamebird-rea-2020
    - topic: releases
      text: "The RSPB puts pheasant releases at about 31.5 million a year (citing Madden 2021)."
      source: rspb-gamebird-register-2024
    - topic: releases
      text: "The RSPB calls released pheasants non-native and cites browsing, predation of reptiles and invertebrates, soil enrichment, disease and lead as concerns; it wants releases licensed."
      source: rspb-gamebird-register-2024
    - topic: releases
      text: "Natural England's review found the stronger evidence was for local harms (soil enrichment, fewer plants and invertebrates near release pens), while habitat management on shoots usually benefited wildlife; smaller releases had smaller effects."
      source: ne-gamebird-rea-2020
    - topic: releases
      text: "GWCT's review says most harms are local and can be reduced by good practice, and that well-run shoots can deliver a net biodiversity gain."
      source: gwct-releasing-review-2021
  confidence: moderate

