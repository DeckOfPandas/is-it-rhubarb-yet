- slug: venison
  impact:
    ghg_kg_co2e_per_kg: null
    ghg_note: "OWID / Poore & Nemecek have no venison category."
    ghg_per_100g_protein: null
    land_use_m2_per_kg: null
    uk:
      - figure: 22.3
        unit: "kg CO2e per kg carcase weight, cradle to processor gate"
        system: "Scottish wild venison (SAC Consulting for the Scottish Venison Association), including the deer's own methane (about 89% of the total); 2.5 kg CO2e per kg if wild-animal emissions are excluded; 11.9 per 100 g protein"
        source: admg-sac-venison-ghg
      - figure: "38% below beef, 49% below lamb"
        unit: "relative carbon footprint"
        system: "Scottish wild venison, first life-cycle assessment (2015, background only)"
        source: naturescot-venison-lca-2015
    uk_note: "No figure for farmed venison or for individual species (red, fallow, roe, Chinese water deer, muntjac)."
  frameworks:
    - body: "British Quality Wild Venison (Forestry Commission, Grown in Britain and venison sector)"
      says: "Audited standard covering wild venison from forest to shop: correct carcass handling, registered premises and full traceability."
      source: gov-bqwv-2023
    - body: "Defra"
      says: "Its 2026 deer policy aims to grow the domestic wild venison market, including through the British Quality Wild Venison standard, as part of managing deer impacts."
      source: defra-deer-policy-2026
  buy: "Look for wild venison under the British Quality Wild Venison standard (gov-bqwv-2023); for wild venison shot with lead the FSA advises frequent eaters to cut down, though it says supermarket farmed large game generally has little or no lead (fsa-lead-shot-game)."
  notes:
    - topic: overabundance
      text: "Defra says deer have grown in range and number over 50 years, and about a third of English woodland is now harmed by them, up from about a quarter in the early 2000s; it calls lethal control the most effective option where fencing and guards fall short."
      source: defra-deer-policy-2026
    - topic: overabundance
      text: "NatureScot estimates Scotland's deer cull must rise by about a quarter, roughly 50,000 more deer a year, to meet its biodiversity targets."
      source: naturescot-deer-cull-2024
    - topic: overabundance
      text: "The government's 2023 announcement said the UK deer population is believed to be at its highest for 1,000 years, at about two million."
      source: gov-bqwv-2023
    - topic: non-native
