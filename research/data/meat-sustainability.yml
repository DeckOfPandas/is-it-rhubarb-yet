      category: "Poultry Meat"
      median: 6
      source: owid-environmental-impacts
      median_note: "OWID text gives poultry at 6 kg CO2e per kg, from its earlier median supply-chain chart, which left out supply-chain losses (owid-faq-impacts)."
      mean: 9.87
      mean_source: owid-ghg-per-kg
    ghg_per_100g_protein:
      category: "Poultry Meat"
      median: 4.3
      source: owid-less-meat
      median_note: "OWID's chart shows medians (labelled chicken); its alt text calls 4.3 an average. Lowest-impact tenth: 2.4; highest-impact: 12."
      p10: 2.4
      mean: 5.7
      mean_source: owid-ghg-per-protein
    land_use_m2_per_kg: {mean: 12, category: "Poultry Meat", source: statista-land-use-per-kg}
    land_use_m2_per_100g_protein: {mean: 7.1, category: "Poultry Meat", source: owid-land-use-per-protein}
    uk: []
    uk_note: "No UK per-kg chicken figure was found. The Soil Association says UK imports about 3 million tonnes of soya a year, mostly for animal feed and largely for chickens, needing about 1.7 million hectares overseas; about 65% comes from countries it calls high-risk for deforestation (soilassoc-peak-poultry)."
  frameworks:
    - body: "Eating Better (Sourcing Better, 2021)"
      says: "Basic: Red Tractor. Better: RSPCA Assured indoor, Red Tractor Enhanced Welfare, or organic. Best: free-range or organic, Label Rouge, Soil Association, or RSPCA Assured free-range or organic."
      source: eatingbetter-sourcing-better-2021
    - body: "RSPCA"
      says: "Recommends RSPCA Assured chicken, whose standard allows only slower-growing, higher-welfare breeds."
      source: rspca-higher-welfare
    - body: "Soil Association"
      says: "Calls for 'peak poultry' and then less and better chicken, pointing to organic, free-range and agroecological systems; supports the Better Chicken Commitment."
      source: soilassoc-peak-poultry
    - body: "Which?"
      says: "Advises shoppers to look for recognised schemes such as RSPCA Assured, free range, organic or Red Tractor, whose standards differ widely, and warns that supermarket farm names are brands and 'higher welfare' has no legal meaning."
      source: which-chicken-labels-2019
  buy: "Look for RSPCA Assured (slower-growing breeds), free-range or organic chicken; Eating Better puts free-range and organic in its Best tier and Red Tractor alone in Basic (rspca-higher-welfare, eatingbetter-sourcing-better-2021)."
  notes:
    - topic: scale
      text: "The Soil Association says about 95% of UK broilers are fast-growing breeds in intensive units and that the UK is about 75% self-sufficient in poultry meat."
      source: soilassoc-peak-poultry
  confidence: moderate

