      kind: method
      confidence: low
      sources: [garlicfarm-rhapsody-wight, garlicfarm-early-wight, fpj-garlic-veterans]
      weeks:
        - [18, 26, in]
        - [27, 37, avail]
      notes:
        season: "Split added: wet garlic is lifted and sold undried, with dates distinct from dried bulbs. The Isle of Wight grower sells first-of-season bulbs as green garlic in May-June, drying from July (garlicfarm-rhapsody-wight; garlicfarm-early-wight). An East Anglian supplier sold fresh green garlic to supermarkets June to mid-September (fpj-garlic-veterans), shown as avail. Second pass found no further source; the Caterer's alliums piece could not be fetched and the web-search budget ran out."
    - name: "Dried"
      kind: method
      confidence: low
      sources: [garlicfarm-growing-guide, garlicfarm-early-wight, rhs-garlic, vegsoc-seasonal]
      weeks:
        - [1, 17, store]
        - [27, 39, in]
        - [40, 52, store]
      notes:
        season: "Split added: dried bulbs follow a later harvest and are then held in store. Harvest runs May-July, with spring-planted types ready in late July (garlicfarm-growing-guide); RHS says spring-planted garlic is ready mid-summer to early autumn. Dry bulbs on sale from July (garlicfarm-early-wight). The Vegetarian Society lists garlic July-September (vegsoc-seasonal), matching the in window. Second pass: no AHDB, NFU or Defra source covers garlic, and the Caterer's alliums piece could not be fetched, so still secondary only."
        discrepancy: "Store end is my extrapolation from RHS home-storage guidance: softneck keeps to mid-spring, hardneck four to six months (rhs-garlic). No commercial storage source found."

- name: "Leeks"
  slug: leeks
  group: alliums
  lines:
    - name: "Leeks"
      kind: whole
      confidence: moderate
      sources: [freshplaza-esg-leeks-2026, ahdb-harvested-in-britain, freshview-crop-report-2025-07, defra-pgi-welsh-leeks]
      weeks:
        - [1, 17, in]
        - [18, 22, avail]
        - [27, 52, in]
      notes:
        season: "Source-age pass of 10 Nov 2026: the dates rested only on ahdb-harvested-in-britain (2015), so the line was lowered to low and refreshed. ESG Drysdale, a Scottish leek grower, runs its season from July to the end of April and can hold leeks in store through June (freshplaza-esg-leeks-2026, 2026). AHDB agrees on new-season leeks by early July, held in the ground over winter and on sale 11 months of the year (ahdb-harvested-in-britain); a wholesaler expected new-season UK leeks at the end of June or start of July 2025 (freshview-crop-report-2025-07). May is avail as the tail of the old crop. June (wks 23-26) is the gap; ESG's stored leeks are one grower's, so not marked store. Field-held leeks are fresh, not store (rule 3)."
        discrepancy: "Dates moved in the source-age pass: previously in Jan-May (wks 1-22) and July-Dec, after AHDB's 11 months on sale (ahdb-harvested-in-britain, 2015); now in to the end of April (wk 17) per freshplaza-esg-leeks-2026, with May avail. Welsh Leeks PGI starts harvest in August (wk 31), about four weeks after the July start (defra-pgi-welsh-leeks)."
    - name: "Welsh (PGI)"
      kind: region
      confidence: high
      sources: [defra-pgi-welsh-leeks]
      weeks:
        - [1, 17, in]
        - [18, 22, avail]
        - [31, 52, in]
      notes:
        season: "Split added: Welsh Leeks is a UK PGI with its own dates. Harvested from August through to April/May; spring-sown crops ready from mid-August; some stand in the field up to 12 months. Short cold storage of up to four weeks is allowed to balance supply, too short to mark as store (defra-pgi-welsh-leeks). May shown as avail because the spec says April/May."

