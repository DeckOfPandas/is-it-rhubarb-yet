- name: "Parsnips"
  slug: parsnips
  group: roots-tubers
  lines:
    - name: "Parsnips"
      kind: whole
      confidence: moderate
      sources: [ahdb-harvested-in-britain, fpj-roots-differing-seasons, fpj-parsnip-underdog, fpj-british-veg-roots, morningadvertiser-pauleys-2007, defra-wholesale-notice-2016-01, defra-wholesale-notice-2016-07, freshview-crop-report-2025-07]
      weeks:
        - [1, 17, in]
        - [18, 26, avail]
        - [27, 52, in]
      notes:
        season: "Field crop lifted fresh for most of the year; roots left in the ground under straw and lifted as needed are fresh, not store (rule 3; ahdb-harvested-in-britain). New British roots season, parsnips included, began in July (Huntapac, fpj-british-veg-roots); Produce World expected the new UK crop on shelves in June (fpj-parsnip-underdog). The old crop runs to April-May, when supply gets tight (Produce World, fpj-roots-differing-seasons). Alan Bartlett & Sons sells parsnips through the year but plans a three-to-four-week import window to bridge old and new crops (fpj-parsnip-underdog); its timing within May-June is not stated, so May-June is avail. Defra monthly notices quote home-grown parsnips in every month from Aug 2015 to Jun 2016, at their dearest in June (defra-wholesale-notice-2016-01; defra-wholesale-notice-2016-07). AHDB singles out winter, when frost sweetens the roots (ahdb-harvested-in-britain), and a foodservice supplier called November the start of the parsnip season (morningadvertiser-pauleys-2007), but neither gives months, so no winter peak is split out."
        discrepancy: "New-crop start: June per Produce World (fpj-parsnip-underdog) vs July per Huntapac (fpj-british-veg-roots), up to four weeks apart; both articles are undated and from different years. In starts at July, with June as avail. Source-age pass: the season-naming sources are old or undated (fpj-roots-differing-seasons 2004; FPJ pieces about 2012-15), with year-round supply from the 2016 Defra notices. The only newer source found, a wholesaler's July 2025 crop report, expected UK parsnips back toward the end of July (about wk 30-31), three to four weeks after the July start; it is secondary and covers one year, so dates not moved (freshview-crop-report-2025-07)."
        year_round: "On sale nearly all year. In = July to April, the season growers name; May-June is avail because the old crop is tailing off and the new crop just starting, not because parsnips are hard to find. Previous Dec-Feb window (a reading of AHDB's 'winter') replaced."

- name: "Potatoes"
  slug: potatoes
  group: roots-tubers
  lines:
    - name: "New"
      kind: variety
      confidence: high
      sources: [defra-pgi-pembrokeshire-earlies, scotgov-pgi-ayrshire-earlies, defra-pgi-comber-earlies, ahdb-harvested-in-britain, fpj-cornish-first-lifted, caterer-new-potatoes]
      weeks:
        - [17, 17, avail]
        - [18, 30, in]
        - [31, 33, avail]
      notes:
        season: "Three UK PGI specs (Pembrokeshire, Ayrshire, Comber in NI) all set harvest from the start of May to the end of July, and call anything lifted later maincrop; AHDB says earlies are usually harvested from May (ahdb-harvested-in-britain). First Cornish liftings can come in late April (fpj-cornish-first-lifted). Tail to mid-August from trade (caterer-new-potatoes). Ayrshire and Comber kept in this note rather than as lines because their dates match. Jersey Royals excluded (Jersey is not UK)."
    - name: "Pembrokeshire"
      kind: region
      confidence: high
      sources: [defra-pgi-pembrokeshire-earlies]
      weeks:
        - [18, 30, in]
      notes:
        season: "PGI spec: usually harvested from the beginning of May to the end of July, weather permitting, after test digs; sold as quickly as possible after lifting (defra-pgi-pembrokeshire-earlies). Added as Helen asked for it; dates as for New."
    - name: "Cornish"
      kind: region
      confidence: low
      sources: [freshplaza-cornish-potatoes-2024, fpj-cornish-campaign, fpj-cornish-first-lifted, grocer-cornish-campaign, wikipedia-uk-protected-foods, freshview-seasonality]
      weeks:
        - [17, 24, avail]
        - [25, 33, in]
      notes:
        season: "Cornish new potatoes have no PGI (wikipedia-uk-protected-foods), so only trade sources exist. In = the national retail window named by the packer Branston: 24 June to mid-August in 2024, 20 June to early August in another year (freshplaza-cornish-potatoes-2024; fpj-cornish-campaign). Earlier liftings from late April go first to Cornish and South West stores (fpj-cornish-first-lifted; grocer-cornish-campaign), shown as avail. A North West supplier's calendar agrees: first Cornish in April, main Cornish supply from the end of June (freshview-seasonality). Second pass found no grower body or Defra source; the Caterer's alliums and potatoes pieces could not be fetched."
        discrepancy: "The named window is a retailer programme rather than a grower season; the PGI earlies elsewhere run May-July (wks 18-30). Gap is more than four weeks at the start, hence low."
    - name: "Maincrop"
      kind: variety
      confidence: moderate
      sources: [ahdb-harvested-in-britain, ahdb-potato-lifting-2020, defra-pgi-pembrokeshire-earlies, fpj-potato-stocks-2017, potatopro-cranfield-storage-2025]
      weeks:
        - [1, 22, store]
        - [31, 35, avail]
        - [36, 43, in]
        - [44, 52, store]
      notes:
        season: "Lifted late summer to early autumn and, with modern storage, usually on sale Sept to May (ahdb-harvested-in-britain). In = Sept-Oct lifting: by 20 Oct 2020, 77% of the GB area was lifted and maincrop lifting was well under way (ahdb-potato-lifting-2020). August = early maincrop after the PGI 31 July cut-off (defra-pgi-pembrokeshire-earlies). Store = Nov-May; AHDB estimated about 1 Mt still in growers' stores at end of March (fpj-potato-stocks-2017)."
        discrepancy: "Cranfield researchers say storage of up to eight months may be halved to about four since the CIPC sprout suppressant was withdrawn (potatopro-cranfield-storage-2025), so the late-spring store tail may be thinner than AHDB's 2015 Sept-May figure suggests."

