        season: "Third pass: still no source for UK-grown mooli or daikon. Mooli is absent from the Vegetarian Society calendar (vegsoc-seasonal), a supplier calendar (freshview-seasonality), the Defra wholesale price notices (defra-wholesale-notice-2016-01), AHDB's Harvested in Britain and Fresh Direct's 2024 market reviews. Searches for mooli growers in Kent, Lincolnshire, Bedfordshire and the Fens, and in FPJ, FreshPlaza and The Grocer, found only garden seed listings and allotment forums; no named commercial grower. Whether any commercial UK supply exists is unconfirmed. Dates not copied from Salad radish (rule 8)."

- name: "Salsify"
  slug: salsify
  group: roots-tubers
  lines:
    - name: "Salsify"
      kind: whole
      confidence: moderate
      sources: [caterer-salsify-2019, scottishfarmer-ab-salsify, grocer-ab-salsify, freshview-seasonality]
      weeks:
        - [1, 8, in]
        - [9, 13, avail]
        - [39, 52, in]
      notes:
        season: "Main UK grower is Albert Bartlett (black salsify, Cambridgeshire and Ayrshire). UK harvest starts in late September and supply runs to the end of February (caterer-salsify-2019). Albert Bartlett says harvest is usually late September to December and expected the season to run into spring (scottishfarmer-ab-salsify; grocer-ab-salsify), so March is avail. A supplier calendar notes UK-grown salsify in March-April (freshview-seasonality)."
        discrepancy: "Whether Jan-Mar supply is stored roots or late liftings is not stated: AB's harvest ends in December but supply continues to spring. The Caterer's 2019 market report said salsify then on sale was mainly Belgian (caterer-salsify-2019)."

- name: "Swede"
  slug: swede
  group: roots-tubers
  lines:
    - name: "Swede"
      kind: whole
      confidence: moderate
      sources: [caterer-swede-2017, fpj-roots-differing-seasons, freshplaza-esg-neeps-2025, defra-wholesale-notice-2016-01, defra-wholesale-notice-2016-07, freshview-seasonality, ltf-seasons-poster]
      weeks:
        - [1, 17, in]
        - [18, 23, store]
        - [24, 25, avail]
        - [26, 52, in]
      notes:
        season: "Fresh harvest: a Devon grower (Frank Clarke and Sons) sows from early March and harvests from mid-June to April, using successive varieties; a market report has first roots in late June, continuing through winter (caterer-swede-2017). Mid-June liftings shown as avail, late June onwards as in. Store: swede can be cold-stored for year-round supply (caterer-swede-2017); Produce World used refrigerated storage to carry old-crop swede beyond May until the new season in June or July (fpj-roots-differing-seasons). ESG Drysdale, a large Scottish swede grower, says swede keeps well and is available all year (freshplaza-esg-neeps-2025). Defra monthly notices quote home-grown swede in every month from Aug 2015 to Jun 2016 (defra-wholesale-notice-2016-01; defra-wholesale-notice-2016-07). A supplier calendar has UK swede ending in May and restarting in July (freshview-seasonality); a schools poster lists it all year (ltf-seasons-poster)."
        discrepancy: "Whether Jan-Apr supply is field-lifted or stored is unclear: the Devon grower harvests to April, but Produce World's storage ran before May too. New-season start varies: mid-June (caterer-swede-2017) vs June or July (fpj-roots-differing-seasons) vs July (freshview-seasonality)."
        year_round: "On sale all year (freshplaza-esg-neeps-2025). Mid-June is avail only because it is the first liftings; May to mid-June is old crop from cold store."

- name: "Turnips"
  slug: turnips
  group: roots-tubers
  lines:
    - name: "Turnips"
      kind: whole
      confidence: low
      sources: [defra-wholesale-notice-2016-01, defra-wholesale-notice-2016-07, vegsoc-seasonal, freshview-seasonality, hortnews-turnip-grower-2023]
      weeks:
        - [1, 52, in]
      notes:
        season: "No grower or body names a turnip season. Defra monthly notices quote home-grown turnip prices in every month from Aug 2015 to Jun 2016 (defra-wholesale-notice-2016-01; defra-wholesale-notice-2016-07); July was not covered by the notices read, but the Vegetarian Society lists June-July (vegsoc-seasonal). Treated as available all year with no named peak, so in all year (rule 3). Whether winter-spring supply is stored is unknown. UK turnip production has shrunk by about two-thirds in 15 years, and one London wholesaler imports 70-80% of its turnips from France (hortnews-turnip-grower-2023), so UK supply may be thin."
        discrepancy: "vegsoc-seasonal lists only Jan, Jun-Jul and Sep-Dec; a supplier calendar has British turnips in December, ending in April (freshview-seasonality). Both are secondary and conflict with the year-round Defra quotes. Low because the dates rest on reading one year of price tables, not on a named season."

# ---------------- Alliums ----------------

- name: "Garlic"
  slug: garlic
  group: alliums
  lines:
