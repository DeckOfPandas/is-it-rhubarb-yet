        season: "Secondary sources only. In = November-February, the months both sources agree on: the Vegetarian Society lists Nov-Feb (vegsoc-seasonal); a North West supplier's market calendar has UK/English artichokes from October to March (freshview-seasonality), so October and March are shown as avail. No grower, AHDB, NFU or Defra source found; not in the NFU chart's item list or the Defra price notices."
