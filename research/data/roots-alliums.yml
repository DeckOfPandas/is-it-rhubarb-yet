# Is It Rhubarb Yet? — clean-room seasonality, group roots-alliums (researched 2026-11-10)
# Week n = days 7n-6..7n from 1 Jan; month weeks: Jan 1-4, Feb 5-8, Mar 9-13, Apr 14-17, May 18-22,
# Jun 23-26, Jul 27-30, Aug 31-35, Sep 36-39, Oct 40-43, Nov 44-48, Dec 49-52.

# ---------------- Roots & tubers ----------------

- name: "Beetroot"
  slug: beetroot
  group: roots-tubers
  lines:
    - name: "Beetroot"
      kind: whole
      confidence: moderate
      sources: [countryside-foskett-beetroot, fpj-beetroot-season-underway, defra-wholesale-notice-2016-01, defra-wholesale-notice-2016-07, freshview-seasonality]
      weeks:
        - [1, 25, store]
        - [26, 26, avail]
        - [27, 43, in]
        - [44, 52, store]
      notes:
        season: "Fresh harvest: a Suffolk grower supplying G's Fresh drills in March-April and lifts July to October, sending about a quarter straight to market and clamping the rest under straw to supply through the winter (countryside-foskett-beetroot). First UK crop of one season was lifted on 30 June (fpj-beetroot-season-underway), shown as avail. Store: Defra monthly wholesale notices quote home-grown beetroot in every month from Aug 2015 to Jul 2016 except January (defra-wholesale-notice-2016-01; defra-wholesale-notice-2016-07); with fresh lifting not starting until late June, the Nov-June supply must be stored crop. A supplier's calendar also lists UK beetroot all year (freshview-seasonality)."
        discrepancy: "Clamp storage is straw-covered field storage, not controlled storage; it is marked store because the roots are lifted and held, not left growing. The store end (wk 25) is inferred from the Defra quotes, not stated by a grower; no source says how long clamped or cold-stored UK beetroot lasts."
        year_round: "On sale all year, fresh July-October and from store otherwise (defra-wholesale-notice-2016-07). The single avail week is the first lifting in late June, not a shortage."

- name: "Carrots"
  slug: carrots
  group: roots-tubers
  lines:
    - name: "Carrots"
      kind: whole
      confidence: high
      sources: [ahdb-harvested-in-britain, bga-carrots-2019, farmersguide-bcga-carrots-2024, ahdb-carrot-field-storage, freshplaza-bcga-carrots-2026-01, freshplaza-bcga-carrots-2026-05, fpj-carrots-hungry-gap]
      weeks:
        - [1, 52, in]
      notes:
        season: "Lifted fresh almost all year (farmersguide-bcga-carrots-2024; bga-carrots-2019): early crops under fleece June-Aug, green-top Aug to first frosts, strawed crops left in the ground and lifted Dec to late May (ahdb-carrot-field-storage). Field-held carrots are fresh harvest, not store (rule 3). No source found for cold-stored UK carrots. New English crop from about the second week of June in Norfolk/Suffolk, mid-July in Yorkshire; Scottish field-held crop fills April-May (freshplaza-bcga-carrots-2026-05; fpj-carrots-hungry-gap)."
        discrepancy: "Supply can be thin in late May to early June (wks 21-23) when the old English crop is finished; in 2026 imports filled the gap (freshplaza-bcga-carrots-2026-05). Not treated as a gap because primary sources describe year-round supply."

- name: "Celeriac"
  slug: celeriac
  group: roots-tubers
  lines:
    - name: "Celeriac"
      kind: whole
      confidence: moderate
      sources: [fpj-celeriac-sales-surge, jackbuck-fg-interview-2020]
      weeks:
        - [1, 30, store]
        - [31, 48, in]
        - [49, 52, store]
      notes:
        season: "Jack Buck Farms near Spalding, said to grow about 90% of UK celeriac, lifts August to November and holds the crop in store until July (fpj-celeriac-sales-surge). The farm's own account: plants raised under glass in April, main crop planted out in May, lifting from August/September and finished by November, then sold from store through winter, almost all year round; December is the busiest month (jackbuck-fg-interview-2020)."
        discrepancy: "Both sources trace back to the same grower, so this is effectively one grower's season. 'Until July' read as through July (wk 30), leaving no gap before the August harvest."

- name: "Horseradish"
  slug: horseradish
  group: roots-tubers
  lines:
    - name: "Cultivated"
      kind: method
      confidence: low
      sources: [tracklements-horseradish, rhs-horseradish, defra-wholesale-notice-2016-01, freshview-seasonality, vegsoc-seasonal, nfu-seasonality-chart]
      weeks:
        - [1, 52, in]
      notes:
        season: "Third pass; split into Cultivated and Wild because the sources treat them separately. Tracklements says its fresh English horseradish root is grown for it in East Anglia and south-east England by a small company that grows only horseradish, and is harvested all year round (tracklements-horseradish). No peak named by a primary source, so in all year (rule 3). The RHS says garden roots are best lifted in autumn or early winter but can be lifted in spring and summer (rhs-horseradish); that is garden advice, not a commercial peak. Low: secondary sources only; the grower is unnamed. Not in AHDB's Harvested in Britain, the Defra wholesale price notices (defra-wholesale-notice-2016-01), a supplier calendar (freshview-seasonality), the Vegetarian Society calendar (vegsoc-seasonal) or the NFU seasonality chart (nfu-seasonality-chart)."
    - name: "Wild"
      kind: method
      confidence: low
      sources: [foragingcourse-horseradish, totallywild-horseradish]
      weeks:
        - [49, 52, in]
      notes:
        season: "Third pass: two foraging guides say wild horseradish root is best harvested in early winter (foragingcourse-horseradish, totallywild-horseradish), read as December. No months are given, so this is a narrow reading; secondary sources only. The young leaves are picked spring to autumn (foragingcourse-horseradish), but this line covers the root."

