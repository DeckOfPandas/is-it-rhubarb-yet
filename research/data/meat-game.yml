- name: Lamb
  slug: lamb
  group: meat-game
  lines:
  - name: New-season
    kind: variety
    confidence: moderate
    sources:
    - nsa-buyers-guide-lamb
    - ahdb-sheep-slaughter-patterns
    - qms-lamb-q2-2026
    - farminguk-hcc-lamb-season
    weeks:
    - - 14
      - 30
      - avail
    - - 31
      - 48
      - in
    - - 49
      - 52
      - avail
    notes:
      season: 'UK-wide. British lamb is on sale all year, most plentiful in autumn; lambs are mostly born in spring
        and reach market about six months later, though some are born early for Easter (nsa-buyers-guide-lamb).
        AHDB puts the lamb kill highest in late summer and early autumn, with UK sheep meat production peaking in
        autumn and more lambs now coming forward before June (ahdb-sheep-slaughter-patterns). In 2026, new-season
        supply built at Scottish marts from May, rising through July and August towards an autumn high (qms-lamb-q2-2026).
        So: avail from April (Easter lambs), in August to November, avail in December; from January the previous
        year''s crop is sold as hogget (see Hogget).'
      discrepancy: AHDB says late summer and early autumn (August to October); NSA says autumn (September to November);
        HCC puts the Welsh peak in August to early September (farminguk-hcc-lamb-season). The in window spans August
        to November to cover both primary sources.
      drift: AHDB says that over 40 years more lambs have come forward before June in their year of birth, and the
        autumn peak has flattened and lengthened (ahdb-sheep-slaughter-patterns, 2021).
  - name: Milk-fed spring
    kind: variety
    confidence: low
    sources:
    - fcdo-rhug-milk-lamb-2014
    - thecaterer-milk-fed-lamb
    - nsa-buyers-guide-lamb
    weeks:
    - - 14
      - 17
      - in
    notes:
      season: 'Third pass: one UK producer found. Rhug Estate (organic, North Wales) sells milk lambs, still suckling
        their mothers while also eating grass, as the first lambs off the farm each year; the first are available
        in April (fcdo-rhug-milk-lamb-2014, a 2014 government blog describing the estate). April only, marked avail
        because no season or end date is named; Rhug''s current lamb pages do not list milk lamb, so whether it
        is still sold is unconfirmed. Low: one secondary source, one producer. Source age: the April date rests
        only on the 2014 blog (the Caterer piece is 2007; nsa-buyers-guide-lamb is current but gives no milk-lamb
        dates). Dating pass, 2026-11-10: no newer source found; Rhug''s 2024 lambing news (updated 2025) does not
        mention milk lamb. The only other milk-fed lamb in UK trade press was imported Pyrenean lamb (thecaterer-milk-fed-lamb,
        2007), out of scope. NSA mentions early-born lambs for Easter but not milk-fed lamb (nsa-buyers-guide-lamb).
        Coordinator, 2026-11-11: rule 2 applied. No source names a season or a peak, so the only availability evidence
        (April) sets in. Still low: one producer, a 2014 source, and Rhug''s current pages don''t list milk lamb,
        so current supply is unconfirmed; a search on 2026-11-11 found no other UK producer. If no current producer
        turns up, this line is a candidate for no_supply.'
  - name: Hogget
    kind: variety
    confidence: moderate
    sources:
    - nsa-buyers-guide-lamb
    - qms-lamb-q2-2026
    - qms-hoggs-may-2013
    - ahdb-spring-lamb-2023
    - fwi-hogget-mutton-upland
    weeks:
    - - 1
      - 13
      - in
    - - 14
      - 23
      - avail
    notes:
      season: Hogget is old-season lamb, born the previous spring and nearly a year old, offered as an Easter option
        (nsa-buyers-guide-lamb). In 2026, hoggs reached market in the first quarter and tightened sharply after
        Easter (qms-lamb-q2-2026). In early May 2013 hoggs were still about 80% of Scottish prime sheep marketings
        (qms-hoggs-may-2013); in early June 2023 AHDB said hogget supply was coming to an end (ahdb-spring-lamb-2023).
        One upland farm markets meat aged 9 to 18 months as hogget, selling from February (fwi-hogget-mutton-upland).
        In = January to March; avail April to early June as supply tails off.
      discrepancy: 'The tail-off varies by year: QMS 2026 shows a sharp drop after Easter (early April); QMS 2013
        and AHDB 2023 show hoggs still on the market in May and early June.'
  - name: Welsh
    kind: region
    confidence: moderate
    sources:
    - hcc-lamb-day
    - hcc-lamb-summer-tips
    - agriland-hcc-lamb-peak
    - farminguk-hcc-lamb-season
    - hcc-welsh-lamb-pgi
    - specialityfood-welsh-lamb
    weeks:
    - - 1
      - 30
      - avail
    - - 31
      - 48
      - in
    - - 49
      - 52
      - avail
    notes:
      season: HCC dates the new season from Lamb Day, 1 August (hcc-lamb-day), puts the peak in August to early
        September (agriland-hcc-lamb-peak, hcc-lamb-summer-tips), and says supply is highest through summer and
        autumn (farminguk-hcc-lamb-season). The PGI has no season but covers lambs slaughtered under a year old
        (hcc-welsh-lamb-pgi), so lambs carry on into the following spring; coastal lambs come earlier than hill
        lambs (specialityfood-welsh-lamb). The avail ranges are my extrapolation from these.
      discrepancy: farminguk-hcc-lamb-season says the second half of the year (from July); hcc-lamb-day starts the
        season on 1 August. Followed the named start date.
      sustainability: Welsh Lamb holds PGI status (hcc-welsh-lamb-pgi, read 2026-11-10).
  - name: Salt marsh
    kind: method
    confidence: moderate
    sources:
    - gower-saltmarsh-lamb-pdo
    - gower-saltmarsh-lamb-pdo-amendment
    - fwi-holker-saltmarsh-lamb
    - lishmans-saltmarsh-lamb
    - booths-saltmarsh-lamb
    - hcc-welsh-lamb-pgi
    weeks:
    - - 23
      - 52
      - in
    notes:
      season: 'Dates are from the Gower Salt Marsh Lamb PDO (UK GI scheme), the only salt marsh source that names
        a season: a seasonal product available from June to the end of December, lambs aged 4 to 10 months at slaughter,
        having grazed the salt marsh for at least half their life and at least 2 months (gower-saltmarsh-lamb-pdo;
        unchanged by the 2024 amendment, which only moved slaughter to named abattoirs, gower-saltmarsh-lamb-pdo-amendment).
        Morecambe Bay (Holker Estate, Cartmel peninsula) is consistent but gives no end date: March-born lambs come
        off the marsh in mid-summer (fwi-holker-saltmarsh-lamb, 2002, quoting a Holker tenant); a Southern Lakes
        butcher had it back on the counter from 9 September 2024 (lishmans-saltmarsh-lamb); Booths calls it a seasonal
        Cumbrian product from Holker tenants (booths-saltmarsh-lamb). Moderate because the PDO covers Gower only.
        The Welsh Lamb PGI does not mention salt marsh grazing (hcc-welsh-lamb-pgi).'
  - name: Mutton
    kind: variety
    confidence: moderate
    sources:
    - nsa-buyers-guide-lamb
    - muttonrenaissance-what-is-mutton
    - fwi-mutton-spec
    weeks:
    - - 1
      - 52
      - in
    notes:
      season: Mutton is meat from older sheep, typically ewes past breeding, and the National Sheep Association's
        current buyers' guide says it is available all year round, naming no best season (nsa-buyers-guide-lamb,
        page copyright 2026). Rule 3 applies, so it is in all year. Helen confirmed this source, 2026-11-10.
      discrepancy: 'Older sources name a peak: the Mutton Renaissance campaign (undated page, campaign launched
        2004) says the best meat is produced October to March, and a 2005 specification launch dated the mutton
        season from 1 October, after summer grazing (muttonrenaissance-what-is-mutton, fwi-mutton-spec). Under the
        source-age rule these pre-2016 sources don''t override the current NSA guide; no newer source naming a mutton
        season was found (searched NSA, AHDB, Farmers Guardian 2022, producer blogs 2021 to 2026).'
- name: Beef
  slug: beef
  group: meat-game
  lines:
  - name: Beef
    kind: whole
    confidence: moderate
    sources:
    - qms-beef-q3-2026
    - ahdb-beef-production-oct-2021
    - hcc-welsh-beef-pgi
    weeks:
    - - 1
      - 52
      - in
    notes:
      season: 'Rule 3 (in all year). Prime cattle are killed every week of the year: the kill is seasonally low
        from mid-June, often dips further in August, peaks in October and has a secondary peak in December, reflecting
        spring calving and a slaughter age of about 21 months (qms-beef-q3-2026). AHDB reports UK beef production
        monthly (ahdb-beef-production-oct-2021). The Welsh Beef PGI sets an age range (12 to 48 months) but no season
        (hcc-welsh-beef-pgi). The kill peak is a supply pattern, not a best-to-eat window, so it is not marked.'
