    notes:
      season: 'Dating pass, 2026-11-10: the first-pass dates rested only on trade press from 2004 and 2009, so the
        line was lowered to low, then refreshed. British Goose Producers (part of the British Poultry Council) say
        fresh free-range geese are available from mid-September until Christmas, the first traditionally eaten at
        Michaelmas (bgp-goose-leaflet-2016); start moved from week 36 to 37 to follow this primary source. In 2021
        the BPC goose farm walk still framed goose as a Christmas bird, about 250,000 eaten each Christmas (poultrysite-goose-farm-walk-2021).
        Older trade press agrees: September to the end of the year, with most eaten at Christmas (fwi-michaelmas-geese,
        2004, quoting the British Goose Producers'' Association chairman). Michaelmas (29 September) marks when
        geese start to become available (farminguk-michaelmas-goose, 2009, quoting the British Goose Producers chairman).
        Defra''s poultry statistics exclude geese, so there is no official monthly series (defra-poultry-statsnotice-jan2021).
        Wild geese are not covered: NatureScot licenses sale of wild goose meat only in a trial in Orkney, the Uists
        and Lewis and Harris (naturescot-wildfowl).'
