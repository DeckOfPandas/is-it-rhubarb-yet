    - fwi-tfta-standards
    - fwi-norfolk-black-turkey
    weeks:
    - - 49
      - 52
      - in
    notes:
      season: 'Split added: traditional free-range, dry-plucked and hung birds are a Christmas product, unlike year-round
        commodity turkey. TFTA Golden Turkeys are sold as Christmas turkeys, grown to maturity and dry-aged at least
        7 days (tfta-golden-turkey); the TFTA minimum rearing age is 20 weeks, most members rear to about 24 (fwi-tfta-standards,
        2007). Norfolk Black: a Norfolk breeder starts slaughtering for Christmas in the first days of December
        and hangs birds for one to three weeks; leftover birds are frozen for Easter (fwi-norfolk-black-turkey,
        2013). No Norfolk Black PGI was found; the search budget ran out before this could be confirmed either way.
        Source age: the December start comes from fwi-norfolk-black-turkey (2013); the current TFTA page (tfta-golden-turkey,
        2026) confirms these are Christmas birds hung at least 7 days but gives no dates. Dating pass, 2026-11-10:
        no newer source with dates was found; a TFTA member farm in a recent (undated, about 2023) Press and Journal
        piece hangs birds at least 10 days before Christmas, consistent with a December slaughter.'
