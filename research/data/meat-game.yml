      season: Rule 3 (in all year). No source states outright that British pork is year-round; this is inferred.
        AHDB's Porkwatch retail survey found British fresh pork at 87% of retail lines in September, 85% in November
        and 84% in January (npa-porkwatch-jan-2023, NPA, February 2023), and AHDB reports weekly clean pig slaughterings
        (grocer-ahdb-pork-supplies, October 2017). No source names a peak. The search budget ran out before AHDB,
        Red Tractor or NPA pages stating year-round supply could be found.
