# Is It Rhubarb Yet? — clean-room seasonality, group: shoots-fruiting (researched 2026-11-10)
# Week n = days 7n-6..7n from 1 Jan; month blocks: Jan 1-4, Feb 5-8, Mar 9-13, Apr 14-17, May 18-22,
# Jun 23-26, Jul 27-30, Aug 31-35, Sep 36-39, Oct 40-43, Nov 44-48, Dec 49-52.

# ---------------- Shoots, pods & stems ----------------

- name: "Asparagus"
  slug: asparagus
  group: shoots-pods-stems
  lines:
    - name: "Outdoor"
      kind: method
      confidence: moderate
      sources: [fpj-asparagus-2026, ahdb-grown-in-britain, freshplaza-asparagus-2022]
      weeks:
        - [14, 16, avail]
        - [17, 25, in]
        - [26, 26, avail]
      notes:
        season: "Growers' association season runs St George's Day (23 Apr) to the solstice (21 Jun), about eight weeks (fpj-asparagus-2026). Southern growers start cutting early to mid April and finish late June (ahdb-grown-in-britain). Volumes low at the official start; shelves fully British by early May (freshplaza-asparagus-2022). AHDB also mentions one grower cutting an autumn crop, no dates given."
        discrepancy: "ahdb-grown-in-britain: early/mid April to late June; growers' association (via fpj-asparagus-2026): 23 Apr to 21 Jun. Edges kept as avail."
    - name: "Protected"
      kind: method
      confidence: moderate
      sources: [ahdb-grown-in-britain, freshplaza-asparagus-tunnels-2026, yahoo-asparagus-early-2022]
      weeks:
        - [5, 8, avail]
        - [9, 16, in]
      notes:
        season: "Split added: tunnels and cloches bring the crop forward three to four weeks, and soil-heated beds give limited supply from early February (ahdb-grown-in-britain). A Hampshire grower using unheated coir tunnels had British spears in shops from 26 Feb 2022, week 9 (yahoo-asparagus-early-2022) and was cutting about six weeks early in March 2026 (freshplaza-asparagus-tunnels-2026). Rule 6 re-applied: no peak named, so the tunnel window (late February until the outdoor crop takes over) is in; the thin heated-bed supply in February is avail."

