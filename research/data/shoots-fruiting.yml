- name: "Aubergine"
  slug: aubergine
  group: squash-fruiting
  lines:
    - name: "Glasshouse"
      kind: method
      confidence: moderate
      sources: [caterer-aubergines-2017, fpj-aubergines-evs, lvga-home, ahdb-grown-in-britain]
      weeks:
        - [9, 43, in]
        - [44, 48, avail]
      notes:
        season: "UK crop is grown almost entirely in greenhouses, March to October; traditionally picked July to September, with modern methods adding about two months at each end (caterer-aubergines-2017). The Lea Valley grows around three-quarters of British aubergines under glass (lvga-home); AHDB lists it as a hydroponic glasshouse crop (ahdb-grown-in-britain). Rule 6 re-applied: no current peak named (the July to September picking is described as historical), so the whole March to October window is in. No outdoor commercial line found."
        discrepancy: "A Yorkshire grower said supply would run until November (fpj-aubergines-evs), about four weeks past caterer-aubergines-2017; November kept as avail."

