- name: "Celery"
  slug: celery
  group: shoots-pods-stems
  lines:
    - name: "Field"
      kind: method
      confidence: moderate
      sources: [ahdb-grown-in-britain, defra-wholesale-prices, vegsoc-seasonal, kentishstour-calendar]
      weeks:
        - [22, 48, in]
      notes:
        season: "Split added because PGI Fenland celery has a distinct, later season. Outdoor planting from early March; harvest from about the end of May until November (ahdb-grown-in-britain). Source-age pass: AHDB (2013) was the only basis for these dates, so the line was lowered to low, then refreshed. Defra's wholesale series quoted home-grown washed celery from 8 Jun to 26 Oct 2026, the series' last date, and again in December 2025 (defra-wholesale-prices); its start is within a week of AHDB's. Defra doesn't separate field from Fenland celery, and its series ends before November, so AHDB's November end stands. Confidence restored to moderate on the newer primary source."
        discrepancy: "Secondary calendars differ widely: vegsoc-seasonal lists January and September to December; kentishstour-calendar lists April to early July. AHDB dates used (rule 2)."
    - name: "Fenland"
      kind: region
      confidence: high
      sources: [eu-fenland-celery-spec, gov-fenland-celery-pgi, ahdb-grown-in-britain, freshplaza-fenland-celery-2013, freshplaza-fenland-celery-2025]
      weeks:
        - [36, 52, in]
      notes:
        season: "PGI specification: transplanted June to July, earthed up in banks to blanch and protect from frost, harvested September to December; only three named varieties allowed (eu-fenland-celery-spec, gov-fenland-celery-pgi). AHDB likewise gives winter white celery as September to December (ahdb-grown-in-britain)."
        discrepancy: "Trade press describes the traditional season as October to December (freshplaza-fenland-celery-2013), and in 2025 the harvest started late October with supply expected to early December (freshplaza-fenland-celery-2025). PGI dates used."

