- name: "Tomatoes"
  slug: tomatoes
  group: squash-fruiting
  lines:
    - name: "Glasshouse"
      kind: method
      confidence: moderate
      sources: [btga-fortnight-2025, btga-about, btga-when-in-season, hortidaily-tomato-fortnight-2026, fpj-buy-british-tomatoes, ahdb-grown-in-britain, defra-wholesale-prices]
      weeks:
        - [1, 8, avail]
        - [9, 48, in]
        - [49, 52, avail]
      notes:
        season: "Rule 6 re-applied. Growers' association: conventional season March to November (btga-fortnight-2025), with year-round supply from some growers using lighting (btga-when-in-season). AHDB: heated-glasshouse fruit marketed February to November, with lit crops on about 12% of the area picking every week (ahdb-grown-in-britain). Neither names a peak, so the whole March to November window is in. British Tomato Fortnight (1 to 14 June in 2026, hortidaily-tomato-fortnight-2026) is a promotion, not a peak, and is no longer used."
        year_round: "On sale all year from lit glasshouses (btga-when-in-season, ahdb-grown-in-britain). Main season March to November (btga-fortnight-2025). Avail in December to February means out of the main season, not hard to get."
        discrepancy: "btga-about gives March to October; ahdb-grown-in-britain starts in February; both about four weeks off btga-fortnight-2025. Defra's wholesale series quoted home-grown round tomatoes from 27 Apr to 26 Oct 2026, with vine and cherry also quoted in December 2025 but not January to mid-April (defra-wholesale-prices). In one year the association announced the season start on 17 April (fpj-buy-british-tomatoes)."
    - name: "Outdoor"
      kind: method
      confidence: low
      sources: [plantura-calendar, ahdb-grown-in-britain]
      weeks:
        - [31, 43, in]
      notes:
        season: "No source found for commercial outdoor UK tomatoes; AHDB says all significant UK production is under glass (ahdb-grown-in-britain). The only outdoor-specific source is a gardening calendar giving August to October (plantura-calendar), so these dates reflect garden growing. Rule 8: the first pass also used general tomato calendars from a wholesaler and the Vegetarian Society, which don't separate outdoor from glasshouse; they are no longer used for this line."
