      notes:
        season: "A forager gives shoots and young leaves March to May, flower buds May to June and seed pods for about two weeks in June to July (gallowaywildfoods-sea-kale). Shoot window used, as that is what the forced line sells; buds and pods not split out. Only one secondary source, so low. No legal or harvesting advice stated, as no primary source was found (rule 7)."

