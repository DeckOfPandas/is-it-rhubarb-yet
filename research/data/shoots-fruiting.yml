        season: "Crowns are forced and blanched in the dark. Westland Nurseries (Worcestershire glasshouses) supplies forced stems January to March (fpj-sea-kale-waitrose); a Waitrose buyer gives the same months (grocer-sea-kale-waitrose); an Angus grower forces it in a heated dark room January to March (list-sea-kale-eassie). No peak named, so the agreed January to March window is in (rule 6)."
