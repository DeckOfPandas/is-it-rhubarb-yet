# Which GitHub owner, repositories and bot account the scripts/ wrappers act
# on. Parsed by scripts/_github_conf.sh, never executed: plain KEY=value only.

# The user or organisation that owns the repositories.
GH_OWNER=your-org

# The repositories the agent may act on, space-separated. The FIRST is the
# default for every wrapper that takes an optional repo.
GH_REPOS="your-repo"

# The bot account AGENT_GH_TOKEN belongs to. GitHub authenticates the token,
# not this name, but github-public-status.sh lets Claude check its own page.
GH_AGENT_USER=your-bot-account

# Repositories whose `main` the agent may push to directly, space-separated.
# Each must also be in GH_REPOS. Empty means `main` only moves by a merged PR.
MAIN_PUSH_REPOS=""
