title: Is It Rhubarb Yet?
description: What UK food is in season, week by week.
url: "https://deckofpandas.github.io"
baseurl: "/is-it-rhubarb-yet"
lang: en-GB
timezone: Europe/London

# One page per food at /<slug>/, written as a stub under _foods/ by
# tools/make-foods.py; the food's data lives in _data/foods.yml and the
# stub only names the slug. _never/ stubs do the same for _data/never.yml,
# the foods that are never in season here. tools/check-foods.py keeps a
# food's slug off the page URLs (now, calendar, wheel, about, sources).
# A stub under _wheels/ (make-foods.py --wheels) becomes a standalone SVG
# of the food's season wheel.
collections:
  foods:
    output: true
    permalink: /:name/
  never:
    output: true
    permalink: /:name/
  wheels:
    output: true
    permalink: /wheel/:name:output_ext

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: foods
    values:
      layout: food
  - scope:
      path: ""
      type: never
    values:
      layout: never
  - scope:
      path: ""
      type: wheels
    values:
      layout: wheel

# The share cards are drawn into _site/cards by tools/cards.js after the
# build; a regenerating `jekyll serve` must not sweep them away.
keep_files:
  - cards

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - CLAUDE.md
  - pytest.ini
  - tests/
  - tools/
  - tmp/
  - scripts/
  - model_instructions/
  - .devcontainer/
  - .claude/
  - vendor/
