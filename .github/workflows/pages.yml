# Build with the Jekyll in the Gemfile and publish to GitHub Pages.
# Pages must be set to "GitHub Actions" as its source in the repository
# settings; the workflow then owns the deploy.
#
# The verdicts in the HTML are baked for the day of the build by
# tools/bake.js, so a build is only as current as its day. The schedule
# rebuilds every day at 03:30 UTC, which is 04:30 in British Summer Time
# and 03:30 in winter; daily, not weekly, because data weeks turn over on
# a different weekday each year. GitHub pauses schedules on a public
# repository after 60 days without a commit; stale-check.yml notices.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A push during the scheduled build queues behind it rather than cancelling
# it, so a day's bake is never lost to a push whose own run then fails.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
        id: pages
      # The share cards are screenshots of small HTML pages, so the deploy
      # needs the same Playwright the container has, installed outside the
      # repository (tmp/ is ignored) and reached through NODE_PATH, as the
      # container does it. The version matches .devcontainer/kit.env.
      # The browser download is kept between runs, keyed on the version;
      # the install step then only checks it is there.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0
      - run: npm install --no-save --no-audit --no-fund --prefix tmp/playwright playwright@1.63.0
      - run: node tmp/playwright/node_modules/playwright/cli.js install --with-deps chromium
      - run: python3 -I tools/check-foods.py
      - run: node --test tests/verdict/verdict.test.js tests/site/search.test.js
      - run: node tools/bake.js
        env:
          TZ: Europe/London
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - run: node tools/fold-ics.js _site
      - run: node tools/cards.js --out _site/cards
        env:
          NODE_PATH: ${{ github.workspace }}/tmp/playwright/node_modules
      - run: node --test tests/cards/cards.test.js tests/build/endpoints.test.js tests/build/charts.test.js
        env:
          NODE_PATH: ${{ github.workspace }}/tmp/playwright/node_modules
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
