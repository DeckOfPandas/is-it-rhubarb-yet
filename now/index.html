{%- comment -%}
The weekly page is the home page; this keeps old /now/ links working and
carries ?week=N across. Jekyll has no redirect without a plugin.
{%- endcomment -%}
<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ site.title }}</title>
  <link rel="canonical" href="{{ '/' | relative_url }}">
  <meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}">
  <script>location.replace("{{ '/' | relative_url }}" + location.search);</script>
</head>
<body>
  <p><a href="{{ '/' | relative_url }}">In season now</a></p>
</body>
</html>
