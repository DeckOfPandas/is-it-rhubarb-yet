# UK seasonality, one entry per food. Generated once by
# tools/make-foods.py and hand-edited since: this file is the truth.
#
# group: a key from _data/groups.yml.
# weeks: [from, to, state] on a 52-week year (week 1 starts 1 January).
# state: in = in season, avail = just coming in or going out.
# colour: per food; a variety may carry its own colour to stand apart.
#         Every colour must reach 3:1 contrast on both backgrounds, forcing
#         shed #16110E and custard #FBF3D9, because the verdict word is set
#         in it. Pink belongs to rhubarb alone: forced rhubarb is the brand
#         pink, and no other food sits near it. Palette redone 18 Oct 2026.
# shades: optional, two or three colours the season wheel sweeps through
#         across the in-season run (unripe, ripe, over), on a food or a
#         variety. The calendar keeps using colour.
# source: ncgm = New Covent Garden Market calendar, bbc = BBC Good Food,
#         basc = BASC shooting seasons, ffs = Flying Fish Seafoods'
#         Cornish chart, general = common knowledge, please check.
# buy: optional, what to ask for at the counter (fish and shellfish).
# said: optional on a variety, how it is said in full. Unset, a variety
#       is its name then the food's: "Bramley apples", "Forced rhubarb".
#       Set it when the name is a noun on its own (Mooli, Calabrese,
#       Mutton) or the phrase hyphenates (New-season lamb).
# aliases: optional, other names a food is asked for by (zucchini). An
#          alias belongs to one food; tools/check-foods.py enforces it.
# also: optional, broader words a food should answer to as well, shared
#       between foods: every fungus answers to "mushrooms".
# Variety names appear as written, mid-sentence too ("Venison Red &
# Fallow"), so proper nouns keep their capitals and the rest are lower-case
# after the first letter.

