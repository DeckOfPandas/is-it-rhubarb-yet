# The line under the giant verdict. One pool per verdict; a quotation
# with `foods` is kept for those foods and preferred over the general
# pool when one of them gets that verdict. Most lines are out of
# copyright (authors dead before 1956, proverbs, traditional rhymes);
# the rest are single attributed lines from twentieth-century authors,
# relied on as fair dealing for quotation (docs/decisions.md). No
# scripture, nothing from franchises. Foreign lines are our own
# translations. Verse line breaks are written " / ".
#
# Every line passes the vetting tests in the scope document: it speaks
# to the verdict's feeling; it is about the food, the waiting or the
# appetite, never the reader's inner life; it would make someone smile
# who only wanted to know about leeks; its attribution can be checked
# in one search, and a line that cannot be traced says "attributed to";
# it is short; it is a whole sentence or a deliberate fragment.
#
# yes: indulge.  yesish: making do (storage, a glasshouse).
# nearly: anticipation.  just: hurry.  no: patience.
# never: resignation, played for laughs.
#
# A food's page picks from the pool by a hash of its slug and the week,
# so a shared link shows the same line all week (assets/verdict.js).
#
# "yes" and "no" are quoted because YAML would otherwise read them as
# booleans.

