  - text: "Abandon all hope, you who enter here."
    by: "Dante, Inferno"
  - text: "I would prefer not to."
    by: "Herman Melville, Bartleby, the Scrivener"
  - text: "Man wants but little here below, / Nor wants that little long."
    by: "Oliver Goldsmith, The Hermit"
  - text: "'Tis better to have loved and lost / Than never to have loved at all."
    by: "Alfred, Lord Tennyson, In Memoriam"
  - text: "Nothing will come of nothing."
    by: "Shakespeare, King Lear"
  - text: "Yes, we have no bananas."
    by: "Frank Silver and Irving Cohn, 1923"
    foods: [bananas]
  - text: "Oranges and lemons, say the bells of St Clement's."
    by: "traditional"
    foods: [oranges, lemons]
  - text: "He picked up the lemons that Fate had sent him and started a lemonade-stand."
    by: "Elbert Hubbard, 1915"
    foods: [lemons]
  - text: "Coffee, which makes the politician wise, / And see through all things with his half-shut eyes."
    by: "Alexander Pope, The Rape of the Lock"
    foods: [coffee]
  - text: "He is the very pineapple of politeness!"
    by: "Mrs Malaprop, The Rivals"
    foods: [pineapples]
  - text: "Yes, by Saint Anne, and ginger shall be hot i' the mouth too."
    by: "Sir Toby Belch, Twelfth Night"
    foods: [ginger]
