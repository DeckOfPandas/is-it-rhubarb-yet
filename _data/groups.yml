# Culinary families, in display order. Every food's `group` must be a key
# here; tools/check-foods.py enforces it. `kind` is the broad class a
# whole-table wheel would be drawn for: veg, fruit, meat, fish or herbs.
- key: roots
  name: Roots & tubers
  kind: veg
- key: brassicas
  name: Brassicas
  kind: veg
- key: alliums
  name: Alliums
  kind: veg
- key: leaves
  name: Leaves & salad
  kind: veg
- key: shoots
  name: Shoots, pods & stems
  kind: veg
- key: fruiting
  name: Squash & fruiting veg
  kind: veg
- key: mushrooms
  name: Mushrooms
  kind: veg
- key: orchard
  name: Orchard fruit
  kind: fruit
- key: soft
  name: Soft fruit & rhubarb
  kind: fruit
- key: nuts
  name: Nuts
  kind: fruit
- key: herbs
  name: Herbs
  kind: herbs
- key: fish
  name: Fish & shellfish
  kind: fish
- key: meat
  name: Meat & game
  kind: meat
