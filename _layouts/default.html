<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="alternate" type="application/json" href="{{ '/api/foods.json' | relative_url }}" title="Season data">
  <script>
    document.documentElement.classList.add('js');
    // A remembered theme is applied before first paint so the page never flashes.
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Calendar</a>
      <a href="{{ '/now/' | relative_url }}"{% if page.url == '/now/' %} aria-current="page"{% endif %}>This week</a>
      <a href="{{ '/year/' | relative_url }}"{% if page.url == '/year/' %} aria-current="page"{% endif %}>The year</a>
      <a href="{{ '/is-it/' | relative_url }}"{% if page.url contains '/is-it/' %} aria-current="page"{% endif %}>Is it … yet?</a>
    </nav>
    <fieldset class="switch theme" data-remember="theme">
      <legend>Theme</legend>
      <input type="radio" name="theme" id="theme-dark" value="dark"><label for="theme-dark">Dark</label>
      <input type="radio" name="theme" id="theme-auto" value="auto" checked><label for="theme-auto">Auto</label>
      <input type="radio" name="theme" id="theme-light" value="light"><label for="theme-light">Light</label>
    </fieldset>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>UK seasons from the New Covent Garden Market calendar and BBC Good Food, with a few foraged extras.
       <a href="{{ '/seasons.ics' | relative_url }}">Subscribe to season starts</a> ·
       <a href="{{ '/api/foods.json' | relative_url }}">Data as JSON</a></p>
  </footer>
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
